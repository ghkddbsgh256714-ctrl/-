/*
 * Shared visual refinement
 *
 * This layer intentionally sits after feature styles. It keeps the existing
 * workflows intact while giving COACH and MEMBER one semantic sage palette,
 * readable text sizes, and safer phone/tablet layouts.
 */
:root {
  --canvas: #f7faf8;
  --surface: #ffffff;
  --surface-raised: #fbfdfb;
  --surface-tint: #e7f1eb;
  --surface-tint-strong: #d8e8de;
  --text: #153b32;
  --text-secondary: #567766;
  --text-tertiary: #698376;
  --border: #d8e7de;
  --action: #3d765d;
  --action-hover: #315f4a;
  --action-soft: #e6f0ea;
  --focus: #5b9474;
  --warning: #8d6637;
  --danger-strong: #a54f4d;

  /* Compatibility aliases for existing feature CSS. */
  --bg: var(--canvas);
  --paper: var(--surface);
  --ink: var(--text);
  --muted: var(--text-secondary);
  --line: var(--border);
  --blue: var(--action);
  --blue-soft: var(--action-soft);
  --navy: var(--action-hover);
  --green: var(--action);
  --green-soft: var(--action-soft);
  --orange: var(--warning);
  --red: var(--danger-strong);
  --red-soft: #fbefed;
  --shadow: 0 10px 28px rgb(33 80 60 / 5%);
  --font: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
}

body {
  background: var(--canvas);
  color: var(--text);
  font: 16px/1.62 var(--font);
  letter-spacing: -0.014em;
}

button,
input,
select,
textarea {
  letter-spacing: inherit;
}

main#page:focus {
  outline: 0;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline-color: var(--focus);
}

h1 {
  font-size: 34px;
  letter-spacing: -0.035em;
  line-height: 1.34;
}

h2 {
  font-size: 22px;
  letter-spacing: -0.022em;
}

h3 {
  font-size: 18px;
  letter-spacing: -0.018em;
}

input,
textarea,
select {
  border-color: var(--border);
  color: var(--text);
}

.sub,
.page-header p {
  color: var(--text-secondary);
  font-size: 15px;
  line-height: 1.62;
}

.footnote {
  color: var(--text-secondary);
  font-size: 13px;
  line-height: 1.68;
}

.eyebrow {
  color: var(--text-secondary);
  letter-spacing: 0.09em;
}

.btn {
  border-color: var(--border);
}

.btn:hover,
.icon-btn:hover {
  background: var(--surface-tint);
}

.btn.primary,
.btn.primary:hover {
  background: var(--action);
  border-color: var(--action);
  color: #fff;
}

.btn.primary:hover {
  background: var(--action-hover);
  border-color: var(--action-hover);
}

.btn.soft {
  color: var(--action-hover);
  background: var(--action-soft);
}

.link,
.step-btn,
.mobile-nav button.active {
  color: var(--action);
}

.badge.blue,
.badge.green {
  color: var(--action-hover);
  background: var(--action-soft);
}

.badge.orange {
  color: var(--warning);
  background: #f7f1e7;
}

.badge.red {
  color: var(--danger-strong);
}

.card {
  border-color: var(--border);
  box-shadow: var(--shadow);
}

.notice.info,
.message.outgoing,
.restbar,
.message,
.coach-note,
.prep-launch,
.prep-member-context,
.personal-milestone {
  background: var(--surface-tint);
  color: var(--text-secondary);
}

.notice.info {
  color: var(--action-hover);
}

.chart-grid {
  stroke: var(--border);
}

.chart-line,
.chart-point {
  stroke: var(--action);
}

.chart-label {
  fill: var(--text-secondary);
}

.bar-col i,
.progress-track {
  background: var(--surface-tint-strong);
}

.bar-col:last-child i,
.timeline-item:before {
  background: var(--action);
}

.ghost-hint,
.number-stepper input::placeholder,
.mobile-nav button,
.drag-handle,
.favorite-btn,
.empty .ico {
  color: var(--text-tertiary);
}

.drag-handle:hover {
  color: var(--action);
  background: var(--action-soft);
}

.drag-origin {
  outline-color: var(--focus);
}

.drag-ghost {
  border-color: var(--focus) !important;
  box-shadow: 0 12px 35px rgb(33 80 60 / 16%) !important;
}

.calendar-drop-target,
.calendar-drop-target:before {
  background: var(--surface-tint-strong) !important;
}

.calendar-drop-target {
  outline-color: var(--focus);
}

.calendar-drag-ghost {
  border-color: var(--focus);
  border-left-color: var(--action);
  background: var(--surface-tint);
}

.calendar-drag-ghost,
.calendar-tip,
.schedule-move-preview > span,
.workout-nav-caption,
.workout-swipe-hint,
.rest-caption,
.photo-state {
  color: var(--text-secondary);
}

.coach .app-sidebar {
  background: #edf5ef;
  border-right-color: var(--border);
  color: var(--text);
}

.coach .brand-symbol i,
.brand-symbol i {
  background: var(--action);
}

.coach .brand small,
.coach .nav-label,
.coach .nav-item,
.coach .side-profile small,
.coach .switch-role {
  color: var(--text-secondary);
}

.coach .nav-item.active {
  background: var(--surface-tint-strong);
  color: var(--action-hover);
}

.coach .nav-item:hover {
  background: var(--surface-tint);
}

.coach .side-profile,
.coach .switch-role {
  border-color: var(--border);
}

.hero-workout .eyebrow,
.hero-workout .sub,
.hero-meta,
.hero-meta strong,

  color: var(--text-secondary);
}

.hero-workout .badge {

}

.hero-workout .btn.light {

  color: #fff;
}

.hero-workout .btn.light:hover {
  background: var(--action-hover);
}

.workout-glyph,
.workout-glyph:before {
  border-color: color-mix(in srgb, var(--action) 30%, transparent);

.workout-glyph .ico {
  stroke: var(--action);

.metric-card .metric-label,
.metric-card .metric-foot,
.member-card .member-stats small,
.member-card .sub,
.pt-next-caption,
.prep-start-dock small,

.member-card .member-stats small {

.prep-row .exercise-detail,
.picker-list .exercise-detail,
.prep-start-dock small,
.basket-selection button,
.exercise-best-records small,
.best-record > span,
.best-record > em,
.inline-weight-step label small,
.workout-note-card small,
.workout-swipe-hint,
.rest-caption > span {
  color: var(--text-secondary);

.best-record > small,

.inline-weight-step label,
.workout-nav-caption,

.workout-note-card strong,
.rest-caption > strong {

.set-actions-refined .set-primary-actions .btn,
.set-secondary-actions .btn,
.set-actions-refined > .set-complete-all {
  font-size: 12px;
}

.workout-nav-tile.next,
.schedule-weekdays input:checked + span {
  background: var(--action);
  border-color: var(--action);
}

.workout-nav-tile:focus-visible,
.workout-note-card:focus-visible,
.schedule-weekdays input:focus-visible + span {
  outline-color: var(--focus);
}

.phone-only .mobile-nav {

  border-color: var(--border);

    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 5px;
    margin: 12px 0 14px;
  }

  .schedule-mobile-days button {
    display: grid;
    place-items: center;
    gap: 2px;
    min-height: 56px;
    padding: 6px 2px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    color: var(--text-secondary);
  }

  .schedule-mobile-days button small {
    font-size: 11px;
    line-height: 1;
  }

  .schedule-mobile-days button strong {
    display: grid;
    place-items: center;
    min-width: 28px;
    min-height: 28px;
    border-radius: 50%;
    font-size: 14px;
  }

  .schedule-mobile-days button.active {
    background: var(--action-soft);
    border-color: var(--border);
    color: var(--action-hover);
  }

  .schedule-mobile-days button.active strong {
    background: var(--action);
    color: #fff;
  }

  .schedule-mobile-day-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 0 10px 47px;
    border-bottom: 1px solid var(--border);
  }

  .schedule-mobile-day-title span {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  .schedule-mobile-day-title strong {
    font-size: 12px;
    line-height: 1.45;
    color: var(--text-secondary);
    font-weight: 500;
    text-align: right;
  }

  .schedule-mobile-calendar-wrap {
    max-height: 520px;
    overflow-y: auto;
    overscroll-behavior: contain;
    border-bottom: 1px solid var(--border);
  }

  .schedule-mobile-calendar {
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr);
  }

  .schedule-mobile-calendar .cal-time {
    height: 78px;
    padding: 9px 0 0;
    font-size: 11px;
    color: var(--text-secondary);
  }

  .schedule-mobile-calendar .cal-half-time {
    top: 43px;
    font-size: 10px;
    color: var(--text-tertiary);
  }

  .schedule-mobile-calendar .schedule-mobile-cell {
    position: relative;
    padding: 0;
    height: 78px;
    border-left: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background-image: linear-gradient(to bottom, transparent 38px, var(--border) 38px, var(--border) 39px, transparent 39px);
  }

  .schedule-mobile-calendar .cal-event {
    left: 6px;
    width: calc(100% - 12px);
    padding: 9px 11px;
    border-radius: 9px;
  }

  .schedule-mobile-calendar .cal-event strong {
    font-size: 14px;
  }

  .schedule-mobile-calendar .cal-event span,
  .schedule-mobile-calendar .cal-event small {
    font-size: 12px;
  }

function metric(label,value,unit,foot,ic){return `<section class="card metric-card"><div class="metric-label"><span>${label}</span>${icon(ic)}</div><div class="metric-value">${value}<small>${unit}</small></div><div class="metric-foot">${foot}</div></section>`}
function scheduleRow(a){const m=member(a.memberId);return `<div class="schedule-row"><div class="time-block">${esc(a.time)}<small>50분</small></div>${avatar(m)}<div class="grow"><div class="exercise-name">${esc(m.name)} ${a.status==='completed'?badge('완료','green'):''}</div><div class="exercise-detail">${esc(a.topic)}</div></div>${a.status==='completed'?btn('기록','member','sm',`data-id="${m.id}"`):btn('수업 준비','prepare','sm',`data-member="${m.id}" data-appointment="${a.id}"`)}</div>`}
function coachHome(){const today=DB.appointments.filter(a=>a.date===TODAY),next=nextAppointment(),a=active(),care=careItems();return header('좋은 하루예요, 지훈 코치님.',`오늘 ${today.length}번의 수업, 회원들의 한 걸음을 함께해 주세요.`,btn(icon('plus')+' 수업 등록','appointment','primary'))+`<div class="metrics">${metric('오늘의 수업',today.length,'회',`${today.filter(a=>a.status==='completed').length}회 완료 · ${today.filter(a=>a.status==='scheduled').length}회 예정`,'calendar')}${metric('함께하는 회원',DB.members.length,'명','회원별 운동 흐름을 살펴보세요','users')}${metric('확인할 피드백',care.length,'건',`${care.filter(c=>c.kind==='red').length}건의 불편감 확인 필요`,'message')}${metric('이번 달 수업',DB.sessions.filter(s=>s.coach&&s.date.startsWith(TODAY.slice(0,7))).length,'회','완료된 PT 기록 기준','chart')}</div><div class="dashboard"><div class="stack">${a?`<section class="hero-workout"><span class="eyebrow">SESSION IN PROGRESS</span><div class="next-class"><div class="grow"><h2>${esc(member(a.memberId).name)}님과 수업 중</h2><p class="sub">${stats(a).sets}세트 완료 · ${esc(a.title)}</p></div>${btn('수업 이어하기 '+icon('arrow'),'resume','light')}</div></section>`:next?`<section class="hero-workout"><span class="eyebrow">NEXT SESSION</span><div class="next-class mt"><div class="next-time"><strong>${next.time}</strong><small>${next.date===TODAY?'오늘':formatDate(next.date,{month:'numeric',day:'numeric'})} · 50분</small></div><div class="grow"><h2>${esc(member(next.memberId).name)} <span style="font-weight:400">· ${esc(next.topic)}</span></h2><p class="sub">${member(next.memberId).remaining}회 남음 · 지난 기록과 컨디션 확인</p></div>${btn('수업 준비 '+icon('arrow'),'prepare','light',`data-member="${next.memberId}" data-appointment="${next.id}"`)}</div></section>`:''}<section class="card"><div class="card-head"><h2>오늘의 타임라인</h2>${link('주간 일정','nav','data-view="schedule"')}</div>${today.sort((a,b)=>a.time.localeCompare(b.time)).map(scheduleRow).join('')||empty('오늘 예정된 수업이 없어요','새 수업을 등록하거나 회원의 기록을 살펴보세요.')}</section><section class="card"><div class="card-head"><h3>최근 회원 활동</h3>${link('회원 보기','nav','data-view="members"')}</div>${DB.sessions.slice().sort((a,b)=>b.startedAt-a.startedAt).slice(0,3).map(s=>`<div class="exercise-row">${avatar(member(s.memberId))}<div class="grow"><div class="exercise-name">${esc(member(s.memberId).name)}님이 ${s.coach?'PT':'개인운동'}을 마쳤어요</div><div class="exercise-detail">${esc(s.title)} · ${stats(s).sets}세트</div></div><span class="exercise-meta">${formatDate(s.date,{month:'numeric',day:'numeric'})}</span>${ib('chevron','session-detail','활동 자세히 보기',`data-id="${s.id}"`)}</div>`).join('')}</section></div><aside class="stack"><section class="card"><div class="card-head"><h3>먼저 살펴봐 주세요</h3>${badge(care.length+'건','orange')}</div>${care.slice(0,3).map(c=>`<div class="care-row">${avatar(member(c.memberId))}<div class="grow"><div class="row between"><strong style="font-size:14px">${esc(member(c.memberId).name)}</strong>${badge(esc(c.title),c.kind)}</div><p>${esc(c.text)}</p>${link('피드백 확인','review',`data-id="${esc(c.id)}"`)}</div></div>`).join('')||empty('모두 확인했어요','새로운 피드백이 생기면 여기에 모아 드려요.')}</section><section class="card"><div class="card-head"><h3>이번 주 수업 흐름</h3>${icon('chart')}</div>${weekBars()}<p class="footnote">등록된 이번 주 일정 기준</p></section></aside></div>`}
function weekBars(){const dow=(new Date(TODAY+'T12:00:00').getDay()+6)%7;const vals=Array.from({length:7},(_,i)=>DB.appointments.filter(a=>a.date===dayOffset(i-dow)).length),max=Math.max(1,...vals);return `<div class="bar-chart">${vals.map((v,i)=>`<div class="bar-col"><i style="height:${Math.max(3,v/max*100)}%"><b>${v}</b></i><small>${'월화수목금토일'[i]}</small></div>`).join('')}</div>`}
function historyRow(s){const st=stats(s),d=new Date(s.date+'T12:00:00');return `<div class="history-row"><div class="history-date"><small>${d.getMonth()+1}월</small><strong>${d.getDate()}</strong></div><div class="exercise-icon">${icon(s.coach?'users':'dumbbell')}</div><div class="grow"><h3>${esc(s.title)}</h3><div class="exercise-detail">${s.coach?'코치와 PT':'개인운동'} · ${st.exercises}개 운동 · ${st.minutes}분</div></div><div class="history-stats"><span>${st.sets}세트</span><span>${num(st.volume)}kg</span></div>${ib('chevron','session-detail','운동 기록 자세히 보기',`data-id="${s.id}"`)}</div>`}
function historyPage(){const hs=memberHistory(),filtered=hs.filter(s=>historyFilter==='all'||(historyFilter==='pt'?s.coach:!s.coach)),recent=hs.filter(s=>s.date>=dayOffset(-28));return header('차곡차곡 쌓인 나의 기록','어제의 나보다, 한 걸음 더.')+`<div class="metrics">${metric('최근 4주 운동',recent.length,'회','PT와 개인운동을 함께 기록해요','calendar')}${metric('총 운동 시간',num(recent.reduce((n,s)=>n+stats(s).minutes,0)),'분','최근 4주 완료 기록 기준','clock')}${metric('완료한 세트',num(recent.reduce((n,s)=>n+stats(s).sets,0)),'세트','완료된 세트만 포함해요','dumbbell')}${metric('이번 주 목표',weeklyCount()+' / '+DB.settings.weeklyGoal,'일','하루에 여러 번 운동해도 1일','target')}</div><div class="detail-split"><section class="card"><div class="card-head"><h2>운동 타임라인</h2></div><div class="tabs mb">${[['all','전체'],['solo','개인운동'],['pt','PT']].map(([id,t])=>`<button class="tab ${historyFilter===id?'active':''}" data-action="history-filter" data-id="${id}">${t}</button>`).join('')}</div>${filtered.map(historyRow).join('')||empty('해당하는 기록이 없어요','다른 필터를 선택해 보세요.')}</section><aside class="stack"><section class="card"><div class="card-head"><h3>스쿼트의 작은 변화</h3>${badge('완료 세트','blue')}</div>${weightChart('m1','sq')}<p class="footnote">회차별 최고 무게 · 워밍업과 실패 세트 제외</p></section>${weekCard()}</aside></div>`}
function weightChart(id,exId){const records=memberHistory(id).slice().reverse().map(s=>({s,values:s.exercises.filter(e=>e.id===exId).flatMap(e=>e.sets.filter(x=>x.status==='done'&&x.kind!=='warmup').map(x=>+x.weight))})).filter(x=>x.values.length).slice(-6).map(x=>({date:x.s.date,value:Math.max(...x.values)}));if(!records.length)return empty('아직 기록이 없어요','해당 운동을 완료하면 변화가 나타나요.');const min=Math.min(...records.map(x=>x.value))-5,max=Math.max(...records.map(x=>x.value))+5;const points=records.map((r,i)=>({x:35+i*(records.length===1?0:410/(records.length-1)),y:150-(r.value-min)/(max-min)*110,...r}));return `<div class="row between"><strong style="font-size:30px">${num(records.at(-1).value)}<small class="muted"> kg</small></strong><span class="badge green">${records.at(-1).value-records[0].value>=0?'+':''}${num(records.at(-1).value-records[0].value)}kg 변화</span></div><div class="chart-wrap"><svg viewBox="0 0 480 190" role="img" aria-label="${records.map(x=>x.date+' '+x.value+'kg').join(', ')}">${[40,90,140].map(y=>`<line class="chart-grid" x1="25" x2="457" y1="${y}" y2="${y}"/>`).join('')}<path class="chart-line" d="${points.map((p,i)=>(i?'L':'M')+p.x+' '+p.y).join(' ')}"/>${points.map(p=>`<circle class="chart-point" cx="${p.x}" cy="${p.y}" r="4"/><text class="chart-label" x="${p.x}" y="${p.y-14}" text-anchor="middle">${p.value}</text><text class="chart-label" x="${p.x}" y="179" text-anchor="middle">${p.date.slice(5).replace('-','/')}</text>`).join('')}</svg></div>`}
function membersPage(){const list=DB.members.filter(m=>(memberFilter==='all'||careItems().some(c=>c.memberId===m.id))&&(!searchTerm||(m.name+m.goal).includes(searchTerm)));return header('함께하는 회원','기록 뒤에 있는 사람, 오늘의 상태부터.',btn(icon('plus')+' 회원 등록','new-member','primary'))+`<div class="toolbar"><div class="tabs"><button class="tab ${memberFilter==='all'?'active':''}" data-action="member-filter" data-id="all">전체 ${DB.members.length}</button><button class="tab ${memberFilter==='care'?'active':''}" data-action="member-filter" data-id="care">확인 필요 ${new Set(careItems().map(c=>c.memberId)).size}</button></div><div class="search">${icon('search')}<input id="member-search" placeholder="이름이나 운동 목표로 검색" aria-label="회원 검색" value="${esc(searchTerm)}"></div></div><div id="member-results" class="member-grid">${memberCards(list)}</div>`}
function memberCards(list){return list.map(m=>{const hs=memberHistory(m.id),c=careItems().find(c=>c.memberId===m.id);return `<section class="card member-card"><div class="row">${avatar(m,true)}<div class="grow"><h2>${esc(m.name)}</h2><p class="sub">${esc(m.joined)}부터 함께</p></div>${c?badge(esc(c.title),c.kind):badge('꾸준히 운동 중','green')}</div><p class="sub mt">${esc(m.goal)}</p><div class="member-stats"><div><strong>${m.remaining}<small>회</small></strong><small>남은 PT</small></div><div><strong>${hs.length}<small>회</small></strong><small>운동 기록</small></div><div><strong>${weeklyCount(m.id)}<small>일</small></strong><small>이번 주 운동</small></div></div><div class="notice ${c?'':'info'}">${esc(c?.text||'다음 수업에서 이어갈 운동을 준비해 보세요.')}</div>${btn('회원 자세히 보기 '+icon('arrow'),'member','',`data-id="${m.id}"`)}</section>`}).join('')||empty('검색 결과가 없어요','다른 이름이나 운동 목표로 검색해 보세요.')}
function memberPage(){const m=member(selectedMember),c=careItems().filter(c=>c.memberId===m.id);return header(esc(m.name)+'님의 운동 여정',esc(m.goal),btn(icon('play')+' 수업 준비','prepare','primary',`data-member="${m.id}"`))+`<div class="card mb"><div class="member-summary">${avatar(m,true)}<div class="grow"><h2>${esc(m.name)}</h2><p class="sub">${esc(m.joined)}부터 함께 · 주 ${m.weekly}회 목표 · PT ${m.remaining}회 남음</p></div>${btn('루틴 배정','assign','soft',`data-member="${m.id}"`)}</div></div><div class="detail-split"><div class="stack"><section class="card"><div class="card-head"><h2>최근 운동</h2>${badge(memberHistory(m.id).length+'회')}</div>${memberHistory(m.id).slice(0,7).map(historyRow).join('')||empty('첫 운동을 기다리고 있어요','수업을 시작하면 이곳에 기록이 쌓여요.')}</section><section class="card"><div class="card-head"><h3>코칭 메모</h3></div><form data-form="member-note"><input type="hidden" name="memberId" value="${m.id}"><label>다음 수업에 기억할 내용<textarea name="note" placeholder="회원의 목표, 주의할 점, 다음 수업 계획을 남겨 주세요.">${esc(m.coachNote||'')}</textarea></label><div>${btn('메모 저장','submit','primary')}</div></form></section></div><aside class="stack"><section class="card"><h3>지금 확인할 내용</h3>${c.map(x=>`<div class="care-row"><div class="grow">${badge(esc(x.title),x.kind)}<p>${esc(x.text)}</p>${link('답변 작성','review',`data-id="${x.id}"`)}</div></div>`).join('')||`<p class="sub mt">확인이 필요한 새 피드백이 없어요.</p>`}</section><section class="card"><div class="card-head"><h3>스쿼트 기록 변화</h3></div>${weightChart(m.id,'sq')}</section></aside></div>`}
function routinesPage(){const visibleRoutines=isCoach?DB.routines:DB.routines.filter(r=>!r.memberId);return header(isCoach?'좋은 수업을 만드는 루틴':'나에게 맞는 운동 루틴',isCoach?'반복되는 준비는 줄이고, 회원에게 더 집중하세요.':'코치가 준비한 운동을 내 페이스대로 이어가세요.',isCoach?btn(icon('plus')+' 루틴 만들기','new-routine','primary'):btn(icon('dumbbell')+' 빈 운동 시작','empty-workout','soft'))+`<div class="grid3">${visibleRoutines.map((r,i)=>`<section class="card routine-card"><div class="routine-band"></div><div class="row between">${badge(esc(r.level),i===1?'orange':i===2?'green':'blue')}<span class="muted" style="font-size:12px">${r.ids.length}개 운동 · 약 ${r.minutes}분</span></div><h2>${esc(r.title)}</h2><p class="sub">${esc(r.subtitle)}<br>${isCoach?'저장된 버전 '+r.revision:'정지훈 코치의 루틴'}</p><ul>${r.ids.slice(0,4).map(id=>{const e=LIB.find(e=>e.id===id);return `<li><span>${esc(e.name)}</span><span>${e.count}세트</span></li>`}).join('')}${r.ids.length>4?`<li><span>외 ${r.ids.length-4}개 운동</span></li>`:''}</ul><div class="row">${btn(isCoach?'루틴 편집':'운동 준비',isCoach?'edit-routine':'checkin','primary grow',`data-id="${r.id}"`)}${isCoach?btn('배정','assign','',`data-routine="${r.id}"`):ib('info','routine-detail','루틴 자세히 보기',`data-id="${r.id}"`)}</div></section>`).join('')}</div>${DB.assignments.length?`<section class="card mt"><div class="card-head"><h3>${isCoach?'최근 배정한 루틴':'새로 받은 루틴'}</h3></div>${DB.assignments.filter(a=>isCoach||a.memberId==='m1').slice().reverse().slice(0,8).map(a=>`<div class="exercise-row"><div class="exercise-icon">${icon('note')}</div><div class="grow"><strong class="exercise-name">${esc(a.routine.title)}</strong><p class="exercise-detail">${esc(member(a.memberId).name)} · ${esc(a.start)}부터 · 버전 ${a.routine.revision}</p></div>${badge('기기에 저장','green')}${!isCoach?btn('운동 준비','assignment-prepare','sm',`data-id="${a.id}"`):''}</div>`).join('')}</section>`:''}`}
function coachPage(){const msgs=DB.messages.filter(m=>m.memberId==='m1'),ap=nextAppointment('m1');return header('운동 사이에도, 함께.','정지훈 코치와 이어가는 나의 운동 이야기')+`<div class="detail-split"><div class="stack"><section class="card"><div class="row">${avatar({name:'정지훈',color:'mint'},true)}<div><h2>정지훈 코치</h2><p class="sub">퍼스널 트레이너 · 함께한 지 7개월</p></div></div><div class="divider"></div><div class="row between"><span class="muted">다음 수업</span><strong>${ap?formatDate(ap.date)+' '+ap.time:'예정된 수업 없음'}</strong></div></section><section class="card"><div class="card-head"><h3>나의 코칭 노트</h3>${badge('기기에 보관','blue')}</div><div class="row">${avatar({name:'정지훈',color:'mint'})}<strong style="font-size:14px">정지훈 코치</strong></div><div class="message">지난번보다 자세가 안정적이었어요. 운동 중 궁금한 점은 여기에 남겨 두세요.<small>예시 코칭 노트</small></div>${msgs.map(m=>`<div class="message ${m.from==='member'?'outgoing':''}">${esc(m.text).replace(/\n/g,'<br>')}<small>${m.from==='member'?'내가 남긴 메모':'코치 답변'} · ${formatDate(m.date,{month:'numeric',day:'numeric'})}</small></div>`).join('')}<div class="divider"></div><form data-form="message"><label>코치에게 남길 메모<textarea name="message" placeholder="운동하면서 궁금했던 점을 적어 주세요." required maxlength="2000"></textarea></label><div class="row between"><small class="muted">체험 모드에서는 이 기기에만 저장돼요.</small>${btn('메모 남기기','submit','primary')}</div></form></section></div><aside class="stack"><section class="card"><h3>나의 PT</h3><div class="week-total mt"><strong>${member('m1').remaining}</strong><span>회 남았어요</span></div><div class="divider"></div><p class="sub">목표: ${esc(member('m1').goal)}</p><p class="footnote">체험용 이용권 정보입니다. 완료 수업은 등록된 PT 회차에 반영돼요. 실제 결제는 연결되어 있지 않아요.</p></section><section class="card coach-note"><h3>다음 수업을 더 알차게</h3><p>오늘의 컨디션, 어려웠던 동작, 잘된 점을 짧게 남겨 주세요. 나에게 맞는 다음 운동을 준비하는 데 도움이 돼요.</p></section></aside></div>`}
function schedulePage(){const dow=(new Date(TODAY+'T12:00:00').getDay()+6)%7,days=Array.from({length:7},(_,i)=>dayOffset(i-dow+weekOffset*7));return header('한 주의 수업을 한눈에','수업을 선택하면 상세 내용과 준비 화면으로 이어져요.',btn(icon('plus')+' 수업 등록','appointment','primary'))+`<section class="card"><div class="toolbar"><div class="row">${ib('back','week-prev','이전 주')}<h2>${formatDate(days[0],{month:'numeric',day:'numeric'})} — ${formatDate(days[6],{month:'numeric',day:'numeric'})}</h2>${ib('chevron','week-next','다음 주')}</div>${btn('이번 주','week-today','sm')}</div><div class="calendar-scroll"><div class="calendar"><div class="cal-head"></div>${days.map((d,i)=>`<div class="cal-head ${d===TODAY?'today':''}">${'월화수목금토일'[i]}<b>${new Date(d+'T12:00').getDate()}</b></div>`).join('')}${Array.from({length:13},(_,i)=>i+9).map(h=>`<div class="cal-time">${h}:00</div>${days.map(d=>{const arr=DB.appointments.filter(a=>a.date===d&&parseInt(a.time)===h);return `<div class="cal-cell">${arr.length?arr.map(a=>`<button class="cal-event ${member(a.memberId).color}" data-action="appointment-detail" data-id="${a.id}"><strong>${esc(member(a.memberId).name)}</strong>${a.time} · ${a.status==='completed'?'완료':esc(a.topic)}</button>`).join(''):`<button class="w-full" style="height:100%;background:transparent" aria-label="${d} ${h}시 수업 등록" data-action="appointment" data-date="${d}" data-time="${String(h).padStart(2,'0')}:00"></button>`}</div>`}).join('')}`).join('')}</div></div></section>`}
function carePage(){const items=careItems();return header('한 번 더 살피는 마음','운동 중의 질문과 불편감, 다음 수업 전에 함께 확인해요.')+`<div class="metrics">${metric('확인 대기',items.length,'건','회원별 질문과 운동 메모','message')}${metric('불편감',items.filter(c=>c.kind==='red').length,'건','다음 운동 전 상태를 확인해 주세요','heart')}${metric('답변 완료',Object.keys(DB.reviews).length,'건','저장한 코칭 피드백','check')}${metric('최근 운동',DB.sessions.filter(s=>s.date>=dayOffset(-7)).length,'회','최근 7일 회원 활동','dumbbell')}</div><div class="detail-split"><section class="card"><div class="card-head"><h2>확인이 필요한 피드백</h2>${badge(items.length+'건','blue')}</div>${items.map(c=>`<div class="care-row">${avatar(member(c.memberId))}<div class="grow"><div class="row wrap"><h3>${esc(member(c.memberId).name)}</h3>${badge(esc(c.title),c.kind)}</div><p>${esc(c.text)}</p><div class="row mt">${btn('답변 작성','review','primary sm',`data-id="${c.id}"`)}${link('회원 기록','member',`data-id="${c.memberId}"`)}</div></div><small class="muted">${formatDate(c.date,{month:'numeric',day:'numeric'})}</small></div>`).join('')||empty('모든 피드백을 확인했어요','회원들의 새로운 운동 이야기를 기다리고 있어요.')}</section><aside class="card" style="align-self:start"><h3>최근 남긴 답변</h3>${Object.values(DB.reviews).slice().reverse().slice(0,5).map(r=>`<div class="care-row"><div><strong style="font-size:14px">${esc(member(r.memberId).name)}</strong><p>${esc(r.text)}</p><small class="muted">${formatDate(r.date,{month:'numeric',day:'numeric'})}</small></div></div>`).join('')||`<p class="sub mt">피드백에 답변하면 이곳에 모아 보여 드려요.</p>`}<p class="footnote">답변은 이 기기에 저장됩니다. 실제 회원에게 알림을 보내지는 않아요.</p></aside></div>`}
function reportPage(){const m=member(selectedMember),month=TODAY.slice(0,7),sessions=DB.sessions.filter(s=>s.coach&&s.date.startsWith(month));return header('기록에서 발견하는 변화','완료된 운동 기록으로 다음 목표를 준비하세요.',btn(icon('download')+' 기록 내보내기','export-csv',''))+`<div class="tabs mb">${[['progress','회원 운동 리포트'],['business','내 수업 현황']].map(([id,t])=>`<button class="tab ${reportTab===id?'active':''}" data-action="report-tab" data-id="${id}">${t}</button>`).join('')}</div>${reportTab==='progress'?`<section class="card mb"><div class="row wrap between"><div class="row">${avatar(m)}<div><h2>${esc(m.name)}</h2><p class="sub">${esc(m.goal)}</p></div></div><select id="report-member" aria-label="리포트 회원 선택" style="width:160px">${DB.members.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div></section><div class="grid2"><section class="card"><div class="card-head"><h3>바벨 백 스쿼트</h3>${badge('최고 무게','blue')}</div>${weightChart(m.id,'sq')}</section><section class="card"><div class="card-head"><h3>루마니안 데드리프트</h3>${badge('최고 무게','blue')}</div>${weightChart(m.id,'rd')}</section></div><section class="card mt"><div class="card-head"><h3>최근 운동 요약</h3></div>${memberHistory(m.id).slice(0,4).map(historyRow).join('')||empty('기록을 기다리고 있어요','운동을 완료하면 리포트가 만들어져요.')}<p class="footnote">최고 무게와 볼륨은 완료된 본 운동 세트 기준입니다. 첫 기록은 비교 기준으로 사용됩니다.</p></section>`:`<div class="metrics">${metric('이번 달 완료',sessions.length,'회','완료된 PT 세션 기준','check')}${metric('월 목표',DB.goal,'회','나의 수업 목표','target')}${metric('목표 달성률',Math.round(sessions.length/DB.goal*100),'%','완료 수업 ÷ 목표','chart')}${metric('목표까지',Math.max(0,DB.goal-sessions.length),'회','꾸준히, 회원과 함께','calendar')}</div><div class="grid2"><section class="card"><h3>이번 달의 수업 목표</h3><form data-form="goal" class="mt"><label>월 목표 수업 수<input type="number" name="goal" min="1" max="999" value="${DB.goal}" required></label><div>${btn('목표 저장','submit','primary')}</div></form><div class="progress-track"><i style="width:${Math.min(100,sessions.length/DB.goal*100)}%"></i></div><p class="footnote">수업 완료와 이용권 차감·정산은 별개입니다. 이 체험판에서는 실제 정산을 처리하지 않습니다.</p></section><section class="card"><h3>회원별 완료 수업</h3>${DB.members.map(m=>`<div class="exercise-row">${avatar(m)}<span class="grow">${esc(m.name)}</span><strong>${sessions.filter(s=>s.memberId===m.id).length}회</strong></div>`).join('')}</section></div>`}`}
function settingsPage(){return header('나에게 맞는 사용 환경','운동에 집중할 수 있도록, 편한 방식으로 설정하세요.')+`<div class="detail-split"><div class="stack"><section class="card"><h2>운동 설정</h2><div class="settings-row"><div><h3>무게 조절 단위</h3><p>무게 양옆의 − / + 버튼으로 조절하는 단위</p></div><select id="setting-weight-step" aria-label="무게 조절 단위">${[0.5,1,2.5,5].map(n=>`<option value="${n}" ${(DB.settings.weightStep||2.5)===n?'selected':''}>${n}kg</option>`).join('')}</select></div><div class="settings-row"><div><h3>기본 휴식 시간</h3><p>세트 완료 후 시작하는 휴식 시간</p></div><select id="setting-rest" aria-label="기본 휴식 시간">${[30,60,90,120,180].map(s=>`<option value="${s}" ${DB.settings.rest===s?'selected':''}>${s}초</option>`).join('')}</select></div><div class="settings-row"><div><h3>자동 휴식 타이머</h3><p>세트를 완료하면 휴식을 시작해요</p></div><button class="toggle ${DB.settings.autoRest?'on':''}" data-action="toggle-auto-rest" role="switch" aria-checked="${DB.settings.autoRest}" aria-label="자동 휴식 타이머"><i></i></button></div><div class="settings-row"><div><h3>주간 운동 목표</h3><p>일주일 동안 운동할 날을 정해요</p></div><select id="setting-goal" aria-label="주간 운동 목표">${Array.from({length:7},(_,i)=>i+1).map(n=>`<option value="${n}" ${DB.settings.weeklyGoal===n?'selected':''}>주 ${n}일</option>`).join('')}</select></div><div class="settings-row"><div><h3>큰 글씨</h3><p>자주 사용하는 글씨를 더 크게</p></div><button class="toggle ${DB.settings.largeType?'on':''}" data-action="toggle-type" role="switch" aria-checked="${DB.settings.largeType}" aria-label="큰 글씨"><i></i></button></div></section><section class="card"><h2>나의 기록 보관</h2><div class="settings-row"><div><h3>기록 백업</h3><p>운동, 루틴, 메모와 설정을 함께 저장해요</p></div>${btn(icon('download')+' 백업','export','')}</div><div class="settings-row"><div><h3>백업 불러오기</h3><p>선택한 백업으로 현재 데이터를 교체해요</p></div>${btn(icon('upload')+' 불러오기','import','')}</div><input type="file" id="backup-file" accept="application/json,.json" hidden><p class="footnote">회원용과 코치용을 같은 웹 주소에서 열면 같은 기기의 데이터를 함께 사용합니다. 파일을 직접 열 때는 브라우저에 따라 저장 공간이 분리될 수 있어요. 백업 파일로 기록을 옮길 수 있습니다.</p></section></div><aside class="stack"><section class="card"><div class="row">${icon('shield')}<h3>체험 모드 안내</h3></div><p class="sub mt" style="line-height:1.9">이 화면의 초기 회원과 기록은 예시입니다. 변경한 내용은 현재 브라우저에 저장됩니다.</p><p class="sub mt" style="line-height:1.9">로그인, 서버 동기화, 실제 메시지 전송, 결제는 연결되어 있지 않습니다. 브라우저 데이터를 지우기 전에 백업해 주세요.</p></section><section class="card"><h3>빠른 이동</h3><div class="help-shortcuts">${btn('루틴','nav','',`data-view="routines"`)}${isCoach?btn('리포트','nav','',`data-view="report"`):btn('내 코치','nav','',`data-view="coach"`)}</div><a class="btn w-full mt" href="${isCoach?'루틴한장_MEMBER.html':'피티한장_COACH.html'}">${icon('swap')}${isCoach?'회원용 루틴한장 열기':'코치용 피티한장 열기'}</a></section><section class="card"><h3>${BRAND}</h3><p class="sub">한 번의 운동, 한 장의 성장.</p><p class="footnote">HANJANG STUDIO · 1.0<br>인터넷 연결 없이도 주요 기능을 사용할 수 있어요.</p></section></aside></div>`}

function getDraft(){return DB.drafts[ROLE]||null}
function makeDraft(r,memberId='m1',appointmentId=null){DB.drafts[ROLE]={id:uid(),title:r.title,memberId,routineId:r.id,exercises:r.ids.map(mkEx),note:r.note,condition:conditionValue,appointmentId,minutes:r.minutes};save()}
function prepPage(){const d=getDraft();if(!d)return empty('준비 중인 운동이 없어요','오늘의 루틴에서 운동을 선택해 주세요.',btn('오늘로','nav','primary','data-view="home"'));const c=member(d.memberId);return header(isCoach?esc(c.name)+'님 수업 준비':'오늘 운동을 준비해요',isCoach?'컨디션을 살펴보고, 오늘의 순서를 정해 주세요.':'순서는 자유롭게. 준비가 되면 시작해 주세요.',btn(icon('back')+' 오늘로','nav','','data-view="home"'))+`<div class="detail-split"><section class="card"><div class="card-head"><div><h2>${esc(d.title)}</h2><p class="sub">${d.exercises.length}개 운동 · ${d.exercises.reduce((n,e)=>n+e.sets.length,0)}세트 · 약 ${d.minutes||45}분</p></div>${link('루틴 변경','choose-routine')}</div><div class="filter-chips">${btn('지난 운동 불러오기','load-previous','sm')}${btn('빈 운동으로','empty-prep','sm')}</div><div id="prep-list">${d.exercises.map((e,i)=>`<div class="prep-row"><div class="exercise-icon">${icon(e.type==='cardio'?'run':'dumbbell')}</div><div class="grow"><div class="exercise-name">${i+1}. ${esc(e.name)}</div><div class="exercise-detail">${esc(e.phase)} · ${exercisePrescription(e)}</div></div><div class="prep-tools">${ib('up','move-prep','운동 앞으로',`data-index="${i}" data-dir="-1" ${i===0?'disabled':''}`)}${ib('down','move-prep','운동 뒤로',`data-index="${i}" data-dir="1" ${i===d.exercises.length-1?'disabled':''}`)}${ib('edit','edit-prep-exercise','운동 목표 편집',`data-index="${i}"`)}${ib('trash','remove-prep','운동 삭제',`data-index="${i}"`)}</div></div>`).join('')||empty('어떤 운동부터 해볼까요?','운동을 추가해 오늘의 루틴을 만들어 주세요.')}</div>${btn(icon('plus')+' 운동 추가','picker','w-full mt','data-mode="prep"')}<div class="session-footer"><span class="muted" style="font-size:13px">${icon('shield')} 준비 내용이 기기에 저장돼요</span>${btn((isCoach?'수업 시작':'운동 시작')+' '+icon('arrow'),'start-session','primary large',d.exercises.length?'':'disabled')}</div></section><aside class="stack"><section class="card"><div class="card-head"><h3>오늘의 컨디션</h3>${link('변경','edit-condition')}</div><div class="row"><div class="exercise-icon" style="color:var(--blue)">${icon(d.condition==='좋음'?'smile':d.condition==='보통'?'n function pickerFilters(){return ['전체','하체','가슴','등','코어','기능성','회복','유산소'].map(p=>`<button class="filter-chip ${pickerPart===p?'active':''}" data-action="picker-part" data-part="${p}">${p}</button>`).join('')}

function exerciseInfo(id){const e=LIB.find(e=>e.id===id);modal(esc(e.name),`<div class="row wrap">${badge(esc(e.part),'blue')}${badge(esc(e.equipment))}</div><div class="cue mt">${icon('info')}<span>${esc(e.cue)}</span></div><h3>기본 목표</h3><p class="sub">${exercisePrescription(e)}</p><p class="footnote">개인의 운동 목표와 컨디션에 맞춰 무게와 횟수를 조절하세요. 불편감이 있으면 운동을 멈추고 담당 코치와 확인해 주세요.</p>`)}
function sessionDetail(id){const s=DB.sessions.find(x=>x.id===id);if(!s)return;const st=stats(s);modal(esc(s.title),`<p class="sub">${esc(member(s.memberId).name)} · ${formatDate(s.date)} · ${s.coach?'PT':'개인운동'}${s.demo?' · 예시 기록':''}</p><div class="summary-numbers"><div><strong>${st.minutes}</strong><small>분</small></div><div><strong>${st.sets}</strong><small>완료 세트</small></div><div><strong>${num(st.volume)}</strong><small>볼륨 · kg</small></div></div>${s.exercises.map(e=>`<div class="exercise-row"><div class="grow"><h3>${esc(e.name)}</h3><p class="exercise-detail">${e.skipped?'생략: '+esc(e.skipReason):e.sets.map((x,i)=>`${x.kind==='warmup'?'W':i+1}세트 ${x.status==='pending'?'미완료':esc(displaySet(x,e))+(x.status==='failed'?' (실패)':'')}`).join(' · ')}</p>${e.replaced?`<p class="exercise-detail">${esc(e.replaced.name)} → 대체 이유: ${esc(e.replaced.reason)}</p>`:''}${e.memo?`<p class="sub">메모: ${esc(e.memo)}</p>`:''}</div></div>`).join('')}${s.note?`<div class="cue mt">${icon('note')}<span>${esc(s.note)}</span></div>`:''}`,true)}
function assignmentDialog(d={}){modal('회원에게 루틴 배정',`<p class="sub">지금의 루틴 구성으로 배정본을 따로 보관합니다.</p><form data-form="assignment"><label>회원<select name="memberId">${DB.members.map(m=>`<option value="${m.id}" ${m.id===(d.member||selectedMember)?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><label>운동 루틴<select name="routineId">${DB.routines.map(r=>`<option value="${r.id}" ${r.id===(d.routine||'r1')?'selected':''}>${esc(r.title)}</option>`).join('')}</select></label><label>시작일<input type="date" name="start" value="${TODAY}" required></label><label>회원에게 남길 가이드<textarea name="note" maxlength="1500" placeholder="이번 루틴에서 집중할 점을 적어 주세요."></textarea></label><p class="notice info">체험 모드에서는 배정 내용이 이 기기에 저장됩니다. 실제 회원에게 전송되지는 않아요.</p><div class="dialog-actions">${btn('취소','close-modal')}${btn('루틴 배정 저장','submit','primary')}</div></form>`)}
function editRoutine(id){const r=id?DB.routines.find(r=>r.id===id):{id:uid(),title:'새 운동 루틴',subtitle:'맞춤 운동',level:'근력',minutes:45,ids:[],note:'',revision:0};routineDraft=clone(r);routineEditor()}
function routineEditor(){modal('운동 루틴 편집',`<form data-form="routine"><label>루틴 이름<input name="title" value="${esc(routineDraft.title)}" maxlength="60" required></label><div class="form-grid"><label>분류<input name="subtitle" value="${esc(routineDraft.subtitle)}" maxlength="50" required></label><label>예상 시간 (분)<input type="number" name="minutes" value="${routineDraft.minutes}" min="5" max="240" required></label></div><div><h3>운동 구성</h3><div id="routine-edit-list">${routineEditList()}</div><label class="mt">운동 추가<select id="routine-add"><option value="">운동을 선택하세요</option>${LIB.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label></div><label>운동 가이드<textarea name="note" maxlength="1500">${esc(routineDraft.note)}</textarea></label><div class="dialog-actions">${btn('취소','close-modal')}${btn('루틴 저장','submit','primary')}</div></form>`,true)}
function routineEditList(){return routineDraft.ids.map((id,i)=>`<div class="exercise-row"><span class="grow exercise-name">${i+1}. ${esc(LIB.find(e=>e.id===id).name)}</span>${ib('up','routine-move','앞으로',`data-index="${i}" data-dir="-1" ${i===0?'disabled':''}`)}${ib('down','routine-move','뒤로',`data-index="${i}" data-dir="1" ${i===routineDraft.ids.length-1?'disabled':''}`)}${ib('trash','routine-remove','운동 삭제',`data-index="${i}"`)}</div>`).join('')||`<p class="sub mt">운동을 추가해 루틴을 구성해 주세요.</p>`}
function appointmentDialog(d={}){const a=d.id?DB.appointments.find(a=>a.id===d.id):null;modal(a?'수업 일정 수정':'새 수업 등록',`<form data-form="appointment"><input type="hidden" name="id" value="${a?.id||''}"><label>회원<select name="memberId">${DB.members.map(m=>`<option value="${m.id}" ${m.id===a?.memberId?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><div class="form-grid"><label>수업 날짜<input type="date" name="date" value="${a?.date||d.date||TODAY}" required></label><label>시작 시간<input type="time" name="time" value="${a?.time||d.time||'10:00'}" min="09:00" max="21:00" step="1800" required></label></div><label>오늘 수업 주제<input name="topic" placeholder="예: 하체 · 코어" value="${esc(a?.topic||'하체 · 코어')}" maxlength="50" required></label><p class="sub">수업은 50분 단위이며, 겹치는 시간에는 등록할 수 없어요.</p><div class="dialog-actions">${btn('취소','close-modal')}${btn(a?'변경 저장':'수업 등록','submit','primary')}</div></form>`)}
function reviewDialog(id){const c=careItems().find(c=>c.id===id);if(!c)return;modal(esc(member(c.memberId).name)+'님의 '+esc(c.title),`<div class="notice ${c.kind==='red'?'':'info'}">${esc(c.text)}</div><form data-form="review" class="mt"><input type="hidden" name="id" value="${c.id}"><input type="hidden" name="memberId" value="${c.memberId}"><label>코치 답변<textarea name="reply" placeholder="질문에 대한 답변과 다음 수업에 참고할 내용을 적어 주세요." required maxlength="2000"></textarea></label><p class="sub">답변을 저장하면 확인 완료로 표시합니다. 실제 알림은 전송되지 않아요.</p><div class="dialog-actions">${btn('나중에','close-modal')}${btn('답변 저장 · 확인 완료','submit','primary')}</div></form>`)}

function move(arr,i,dir){const j=i+dir;if(i<0||j<0||i>=arr.length||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]}
function download(name,data,type='application/json'){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){download(`한장_기록백업_${TODAY}.json`,JSON.stringify(DB,null,2));toast('백업 파일을 내려받았어요.')}
function keepRoutineFields(){const f=$('[data-form="routine"]');if(!f)return;const d=new FormData(f);routineDraft.title=d.get('title');routineDraft.subtitle=d.get('subtitle');routineDraft.minutes=+d.get('minutes');routineDraft.note=d.get('note')}
function editPrepExercise(i){const e=getDraft().exercises[i];modal('운동 목표 조절',`<p class="sub">${esc(e.name)}</p><form data-form="prep-exercise"><input type="hidden" name="index" value="${i}"><label>운동 구간<select name="phase">${['준비 운동','본 운동','마무리'].map(p=>`<option ${p===e.phase?'selected':''}>${p}</option>`).join('')}</select></label><div class="form-grid">${metricFields(e).map(f=>`<label>${f.label}<input type="number" name="${f.key}" value="${e[f.key]||f.min}" min="${f.min}" max="${f.max}" step="${f.step}" required></label>`).join('')}<label>세트 수<input type="number" name="count" value="${e.sets.length}" min="1" max="20" required></label></div><div class="dialog-actions">${btn('목표 저장','submit','primary')}</div></form>`)}
function chooseRoutine(){modal('오늘의 루틴 선택',`<div>${DB.routines.map(r=>`<div class="exercise-row"><div class="grow"><h3>${esc(r.title)}</h3><p class="sub">${r.ids.length}개 운동 · 약 ${r.minutes}분</p></div>${btn('선택','load-routine','soft sm',`data-id="${r.id}"`)}</div>`).join('')}</div><p class="footnote">준비 중인 운동 구성이 선택한 루틴으로 바뀝니다.</p>`)}
function openRestFocus(){if(!active()?.rest)return;const r=active().rest;modal('잠깐, 호흡을 골라요',`<div class="rest-focus"><p class="sub">${esc(r.sourceName)} · 다음 세트를 준비해요</p><div class="rest-ring"><strong data-rest-clock>${fmt(remainingRest())}</strong></div><div class="row" style="justify-content:center">${[60,90,120].map(n=>btn(n+'초','rest-preset','sm',`data-seconds="${n}"`)).join('')}</div><div class="row mt" style="justify-content:center">${btn('−10초','rest-adjust','','data-seconds="-10"')}${btn(r.paused?icon('play')+' 계속':icon('pause')+' 일시정지','rest-pause','primary')}${btn('+10초','rest-adjust','','data-seconds="10"')}</div><div class="mt">${link('휴식 끝내기','rest-stop')}</div></div>`);tick()}
function handle(action,d,el){
 switch(action){
 case 'submit':el.closest('form')?.requestSubmit();break;
 case 'close-modal':closeModal();break;
 case 'nav':closeModal();go(d.view);break;
 case 'resume':closeModal();if(active()){currentEx=active().currentEx||0;go('workout')}break;
 case 'notifications':{const arr=isCoach?careItems().map(c=>({title:member(c.memberId).name+' · '+c.title,text:c.text,action:'review',id:c.id})):DB.assignments.filter(a=>a.memberId==='m1').map(a=>({title:'새 루틴이 도착했어요',text:a.routine.title,action:'routine-detail',id:a.routine.id}));modal('나의 알림',arr.length?arr.slice().reverse().map(a=>`<div class="exercise-row"><div class="grow"><h3>${esc(a.title)}</h3><p class="sub">${esc(a.text)}</p></div>${btn('보기',a.action,'sm',`data-id="${a.id}"`)}</div>`).join(''):empty('새로운 알림이 없어요','나의 운동 흐름에 필요한 소식을 모아 드려요.'));break}
 case 'checkin':checkin(DB.routines.find(r=>r.id===d.id)||assignedRoutine());break;
 case 'assignment-prepare':checkin(DB.assignments.find(a=>a.id===d.id).routine);break;
 case 'edit-condition':conditionDialog(true);break;
 case 'condition':conditionValue=d.id;$$('.condition').forEach(b=>{b.classList.toggle('active',b.dataset.id===d.id);b.setAttribute('aria-pressed',b.dataset.id===d.id)});$('#condition-detail')?.classList.toggle('hidden',d.id!=='피곤함');break;
 case 'prepare':{if(active()){handle('resume',{},el);toast('진행 중이던 수업을 이어갑니다.');break}selectedMember=d.member||selectedMember;conditionValue='보통';const r=assignedRoutine(selectedMember);if(getDraft()&&getDraft().memberId===selectedMember){if(d.appointment)getDraft().appointmentId=d.appointment;save()}else makeDraft(r,selectedMember,d.appointment||null);closeModal();go('prep');break}
 case 'empty-workout':checkin({id:'empty',title:'나만의 오늘 운동',ids:[],note:'컨디션에 맞는 운동으로 오늘의 루틴을 만들어 보세요.',minutes:30});break;
 case 'empty-prep':modal('오늘 루틴을 비울까요?',`<p class="sub">준비 중인 운동 목록을 비웁니다. 저장된 원래 루틴은 남아 있어요.</p><div class="dialog-actions">${btn('취소','close-modal')}${btn('목록 비우기','confirm-empty-prep','danger')}</div>`);break;
 case 'confirm-empty-prep':getDraft().exercises=[];getDraft().title='나만의 오늘 운동';save();closeModal();render();break;
 case 'move-prep':move(getDraft().exercises,+d.index,+d.dir);save();render();break;
 case 'remove-prep':getDraft().exercises.splice(+d.index,1);save();render();break;
 case 'edit-prep-exercise':editPrepExercise(+d.index);break;
 case 'choose-routine':chooseRoutine();break;
 case 'load-routine':{const r=DB.routines.find(r=>r.id===d.id),old=getDraft();const cond=old.condition,memo=old.conditionMemo;makeDraft(r,old.memberId,old.appointmentId);getDraft().condition=cond;getDraft().conditionMemo=memo;save();closeModal();render();toast('오늘 운동 구성을 바꿨어요.');break}
 case 'load-previous':{const old=memberHistory(getDraft().memberId)[0];if(!old){toast('불러올 지난 운동이 없어요.');break}const dr=getDraft();dr.exercises=old.exercises.filter(e=>!e.skipped).map(e=>({...clone(e),instance:uid(),sets:e.sets.map(()=>({weight:'',reps:'',duration:'',distance:'',status:'pending',kind:'normal'})),memo:'',replaced:undefined}));dr.title=old.title;save();render();toast('지난 운동 구성을 불러왔어요.');break}
 case 'start-session':{if(active()){handle('resume',{},el);break}const dr=getDraft();if(!dr?.exercises.length)return;DB.active[ROLE]={...clone(dr),id:uid(),date:TODAY,startedAt:Date.now(),planned:clone(dr.exercises),coach:isCoach,rest:null,currentEx:0};DB.drafts[ROLE]=null;currentEx=0;save();go('workout');toast(isCoach?'수업을 시작했어요.':'오늘도 내 페이스대로 시작해요.');break}
 case 'picker':picker(d.mode||'live');break;
 case 'picker-part':pickerPart=d.part;$('#picker-filters').innerHTML=pickerFilters();$('#picker-results').innerHTML=pickerResults();break;
 case 'pick-exercise':{if(pickerMode==='replace'){modalContext.replaceId=d.id;modal('운동을 대체하는 이유',`<p class="sub">${esc(active().exercises[currentEx].name)} → ${esc(LIB.find(e=>e.id===d.id).name)}</p><form data-form="replace"><label>대체 이유<select name="reason"><option>기구 사용 중</option><option>몸 상태에 맞게 조절</option><option>동작이 어려워서</option><option>다른 운동으로 진행</option></select></label><div class="dialog-actions">${btn('취소','close-modal')}${btn('이 운동으로 대체','submit','primary')}</div></form>`);break}const ex=mkEx(d.id);(pickerMode==='prep'?getDraft():active()).exercises.push(ex);save();closeModal();render();toast(ex.name+'을 추가했어요.');break}
 case 'select-exercise':currentEx=+d.index;active().currentEx=currentEx;save();render();break;
 case 'next-exercise':currentEx=Math.min(currentEx+1,active().exercises.length-1);active().currentEx=currentEx;save();render();window.scrollTo(0,0);break;
 case 'add-set':{const ex=active().exercises[currentEx];if(ex.sets.length>=30){toast('운동당 최대 30세트까지 추가할 수 있어요.');break}ex.sets.push({weight:'',reps:'',duration:'',distance:'',status:'pending',kind:'normal'});save();render();break}
 case 'set-type':{const set=active().exercises[currentEx].sets[+d.index];if(set.status!=='pending'){toast('완료를 취소한 뒤 세트 유형을 바꿀 수 있어요.');break}set.kind=set.kind==='warmup'?'normal':'warmup';save();render();break}
 case 'step-value':{const e=active()?.exercises[currentEx],s=e?.sets[+d.index];if(!s||s.status!=='pending')return;const f=metricFields(e).find(f=>f.key===d.field);if(!f)return;const step=f.key==='weight'?(DB.settings.weightStep||2.5):f.key==='duration'?5:f.key==='distance'?10:1;const before=s[f.key]===''||s[f.key]==null?(+suggestedValue(e,+d.index,f.key)||f.min):+s[f.key];s[f.key]=String(Math.min(f.max,Math.max(f.min,Math.round((before+step* +d.dir)*100)/100)));save();const input=$(`[data-set="${d.index}"][data-field="${d.field}"]`);if(input)input.value=s[f.key];updateSuggestions();break}
 case 'complete-set':setComplete(+d.index);break;
 case 'set-menu':{const e=active().exercises[currentEx],i=+d.index,s=e.sets[i];modal(`${i+1}세트 옵션`,`<p class="sub">${esc(e.name)}</p><div class="stack">${s.status==='pending'?btn('실패한 세트로 기록','fail-set','danger',`data-index="${i}"`):btn('기록 취소 후 수정','undo-set','',`data-index="${i}"`)}${btn('이 세트 삭제','delete-set','',`data-index="${i}" ${e.sets.length<=1?'disabled':''}`)}</div><p class="footnote">실패한 시도도 기록으로 남지만 완료 세트와 성과에는 포함되지 않습니다.</p>`);break}
 case 'fail-set':setComplete(+d.index,true);break;
 case 'undo-set':{const s=active().exercises[currentEx].sets[+d.index];s.status='pending';active().rest=null;save();closeModal();render();break}
 case 'delete-set':{const e=active().exercises[currentEx];if(e.sets.length>1){e.sets.splice(+d.index,1);save()}closeModal();render();break}
 case 'fill-previous':case 'fill-first':{const e=active().exercises[currentEx],prior=action==='fill-first'?[e.sets[0]]:previousSets(e,active().memberId);if(!prior.length){toast('이 운동의 이전 기록이 없어요.');break}let count=0;e.sets.forEach((s,i)=>{if(s.status!=='pending')return;const p=prior[action==='fill-first'?0:i]||prior.at(-1);for(const f of metricFields(e)){if((s[f.key]===''||s[f.key]==null)&&p?.[f.key]!==''&&p?.[f.key]!=null){s[f.key]=String(p[f.key]);count++}}});save();render();toast(count?'비어 있는 입력만 채웠어요.':'채울 빈 입력이나 참고할 값이 없어요.');break}
 case 'exercise-info':exerciseInfo(d.id);break;
 case 'exercise-history':{const e=active().exercises[currentEx];const hs=memberHistory(active().memberId).filter(s=>s.exercises.some(x=>x.id===e.id));modal(esc(e.name)+' · 이전 기록',hs.length?hs.slice(0,5).map(s=>{const ex=s.exercises.find(x=>x.id===e.id);return `<div class="exercise-row"><div><h3>${formatDate(s.date)}</h3><p class="sub">${ex.sets.filter(x=>x.status==='done').map(x=>esc(displaySet(x,e))).join(' · ')}</p></div></div>`}).join(''):empty('첫 기록을 시작해요','아직 이 운동의 이전 기록이 없어요.'));break}
 case 'exercise-menu':{const e=active().exercises[currentEx];modal(esc(e.name),`<div class="stack">${btn(icon('info')+' 운동 안내','exercise-info','',`data-id="${e.id}"`)}${btn(icon('swap')+' 다른 운동으로 대체','replace-exercise')}${btn(icon('skip')+' 오늘은 생략하기','skip-exercise')}${btn(icon('up')+' 순서 앞으로','move-live','','data-dir="-1" '+(currentEx===0?'disabled':''))}${btn(icon('down')+' 순서 뒤로','move-live','','data-dir="1" '+(currentEx===active().exercises.length-1?'disabled':''))}</div>`);break}

function cardioRecordDialog(){const c=active().activeCardio,m=CARDIO_MODES.find(m=>m.id===c.mode);if(!c.paused){c.elapsed=cardioSeconds();c.paused=true;save()}const fieldLabels={distance:['거리 (km)',0.01,1000,.01],speed:['평균 속도 (km/h)',0,100,.1],incline:['경사 (%)',0,50,.5],level:['레벨',0,100,1],floors:['층수',0,10000,1],rpm:['평균 RPM',0,300,1],watt:['평균 와트',0,2000,1]};modal(c.name+' 기록',`<p class="sub">기구나 워치의 실제 기록을 남겨 주세요. 추정값을 자동으로 채우지 않아요.</p><form data-form="cardio-record"><div class="form-grid"><label>운동 시간 (분)<input type="number" name="minutes" min="0.1" max="1440" step="0.1" value="${Math.max(.1,Math.round(c.elapsed/6)/10)}" required></label>${m.fields.filter(k=>k!=='handsFree').map(k=>{const f=fieldLabels[k];return `<label>${f[0]}<input type="number" name="${k}" min="${f[1]}" max="${f[2]}" step="${f[3]}" placeholder="선택"></label>`}).join('')}<label>평균 심박 (bpm)<input type="number" name="avgHR" min="20" max="250" placeholder="선택"></label><label>최대 심박 (bpm)<input type="number" name="maxHR" min="20" max="250" placeholder="선택"></label><label>활동 칼로리 (kcal)<input type="number" name="calories" min="0" max="10000" placeholder="선택"></label></div>${m.fields.includes('handsFree')?`<label>손잡이 사용<select name="handsFree"><option value="">기록하지 않음</option><option value="yes">손잡이 없이 진행했어요</option><option value="no">손잡이를 사용했어요</option></select></label>`:''}<label>체감 강도<select name="effort"><option>가벼웠어요</option><option selected>적당했어요</option><option>힘들었어요</option><option>많이 힘들었어요</option></select></label><label>운동 메모<textarea name="note" maxlength="1000"></textarea></label><div class="dialog-actions">${btn('운동으로 돌아가기','close-modal')}${btn('유산소 기록 저장','submit','primary')}</div></form>`)}

const convenienceHandle=handle;handle=function(a,d,el){switch(a){case 'cardio-mode':courseDialog(d.id);return;case 'course-filter':courseFilter=d.id;$$('#modal .filter-chip').forEach(b=>b.classList.toggle('active',b.dataset.id===d.id));$('#course-results').innerHTML=courseResults();return;case 'course-favorite':{const key=cardioMode+':'+d.id;DB.favoriteCourses=DB.favoriteCourses.includes(key)?DB.favoriteCourses.filter(x=>x!==key):[...DB.favoriteCourses,key];save();$('#course-results').innerHTML=courseResults();return}case 'course-start':{const i=+d.id.replace('course',''),x=COURSE_NAMES[i];selectedCourse={id:d.id,name:x[0],part:x[1],minutes:x[2]};if(active()){beginCardio()}else{modal('시작 전, 몸 상태를 확인해요',`<form data-form="cardio-checkin"><label>오늘의 컨디션<select name="condition"><option>좋음</option><option>보통</option><option>피곤함</option></select></label><div class="dialog-actions">${btn('유산소 시작','submit','primary')}</div></form>`)}return}case 'cardio-pause':{const c=active().activeCardio;if(c.paused){c.lastStarted=Date.now();c.paused=false}else{c.elapsed=cardioSeconds();c.paused=true}save();render();return}case 'cardio-finish':cardioRecordDialog();return;case 'resume':if(active()?.activeCardio||active()&&!active().exercises.length){closeModal();go('cardio');return}break;case 'download-summary':{const s=DB.sessions.find(s=>s.id===d.id);download('운동요약_'+s.date+'.txt',JSON.stringify(s,null,2),'text/plain');return}}convenienceHandle(a,d,el)};

function photoUploadUI(context){return `<div class="photo-upload" data-photo-context="${context}"><div class="row between"><strong style="font-size:14px">운동 · 자세 사진</strong><span class="muted" style="font-size:11px">최대 3장</span></div><div class="photo-thumbs" id="photo-pending"></div><div class="row wrap mt" style="margin-top:12px"><label class="btn sm"><input class="photo-file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>사진 선택</label><label class="btn sm"><input class="photo-file" type="file" accept="image/*" capture="environment" hidden>카메라로 촬영</label></div><p class="footnote" style="margin-top:10px">JPG · PNG · WebP, 장당 8MB까지. 이 기기에 저장되며 실제 전송되지 않습니다.</p><div class="photo-state" role="status"></div></div>`}

async function preparePhoto(file){if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('JPG, PNG, WebP 사진을 선택해 주세요.');if(file.size>8*1024*1024)throw Error('사진은 한 장당 8MB까지 첨부할 수 있어요.');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});const img=new Image();img.src=data;await img.decode();const max=1200,ratio=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*ratio);canvas.height=Math.round(img.naturalHeight*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let output=canvas.toDataURL('image/jpeg',.78);if(output.length>600000)output=canvas.toDataURL('image/jpeg',.5);if(output.length>1000000)throw Error('사진 용량이 커서 저장하기 어려워요. 더 작은 사진을 선택해 주세요.');return {id:uid(),name:file.name,data:output,width:canvas.width,height:canvas.height}}

function fullSessionText(s){
 const st=stats(s),lines=[`[${s.coach?'피티한장 · PT':'루틴한장 · 개인운동'} 기록]`,`${formatDate(s.date)} · ${member(s.memberId).name}`,`${s.title}`,`운동 시간 ${st.minutes}분 · 완료 ${st.sets}세트 · 웨이트 볼륨 ${num(st.volume)}kg`, `컨디션: ${s.condition||'기록 없음'}${s.conditionMemo?' / '+s.conditionMemo:''}`,''];
 s.exercises.forEach((e,i)=>{lines.push(`${i+1}. ${e.name}${e.group?' [슈퍼세트 '+e.group+']':''}`);if(e.replaced)lines.push(`   대체: ${e.replaced.name} → ${e.name} / ${e.replaced.reason}`);if(e.skipped)lines.push('   생략 이유: '+(e.skipReason||'미기록'));else e.sets.forEach((set,j)=>{const fields=metricFields(e),values=fields.map(f=>`${f.key==='weight'?(e.type==='assist'?'보조 무게':'무게'):f.key==='reps'?'횟수':f.key==='duration'?'시간':'거리'} ${set[f.key]===''||set[f.key]==null?'미입력':set[f.key]+(f.key==='weight'?'kg':f.key==='reps'?'회':f.key==='duration'?'초':'m')}`).join(' · ');lines.push(`   ${j+1}세트${set.kind==='warmup'?' (워밍업)':''}: ${values} / ${set.status==='done'?'완료':set.status==='failed'?'실패':'미완료'}`)});if(e.memo)lines.push(`   ${e.needsCare?'코치 질문':'운동 메모'}: ${e.memo}`);if(e.attachments?.length)lines.push(`   자세 사진 ${e.attachments.length}장 첨부 (텍스트 복사와 별도)`);lines.push('')});
 if(s.cardioActivities?.length){lines.push('[유산소 기록]');s.cardioActivities.forEach((c,i)=>{lines.push(`${i+1}. ${c.name} · ${c.course?.name||'자유 운동'}`,`   시간 ${fmt(c.seconds)}${c.distance!=null?' · 거리 '+c.distance+'km':''}${c.speed!=null?' · 평균 속도 '+c.speed+'km/h':''}${c.pace?' · 페이스 '+c.pace+'/km':''}`);const v=[['incline','경사','%'],['level','레벨',''],['floors','층수','층'],['rpm','평균 RPM',''],['watt','평균 와트','W'],['avgHR','평균 심박','bpm'],['maxHR','최대 심박','bpm'],['calories','활동 칼로리','kcal']].filter(([k])=>c[k]!=null).map(([k,n,u])=>n+' '+c[k]+u);if(v.length)lines.push('   '+v.join(' · '));if(c.handsFree!=null)lines.push('   손잡이 '+(c.handsFree?'사용하지 않음':'사용함'));if(c.effort)lines.push('   체감 강도: '+c.effort);if(c.challenge)lines.push('   챌린지: '+(c.challengeMet?'목표 달성':'목표 미달성'));if(c.note)lines.push('   메모: '+c.note);lines.push('')})}
 const x=s.extras||{};if(Object.keys(x).length){lines.push('[운동 후 체크]');if(x.avgHR!=null)lines.push('평균 심박: '+x.avgHR+'bpm');if(x.maxHR!=null)lines.push('최대 심박: '+x.maxHR+'bpm');if(x.calories!=null)lines.push('활동 칼로리: '+x.calories+'kcal');if(x.confidence)lines.push('운동 이해도: '+x.confidence);if(x.pain)lines.push('통증·불편감: '+x.pain);if(x.diet)lines.push('식단: '+x.diet);if(x.lifestyle)lines.push('생활 메모: '+x.lifestyle);lines.push('')}
 if(s.effort)lines.push('전체 운동 강도: '+s.effort+'/5');if(s.note)lines.push('오늘의 한 줄: '+s.note);
 const lifestyle=DB.lifestyle.filter(x=>x.memberId===s.memberId&&x.date===s.date).at(-1);if(lifestyle){lines.push('','[오늘의 생활 기록]');if(lifestyle.sleep!=null)lines.push('수면 '+lifestyle.sleep+'시간');if(lifestyle.water!=null)lines.push('물 '+lifestyle.water+'L');lines.push('식단: '+lifestyle.diet);if(lifestyle.note)lines.push(lifestyle.note)}
 const body=(DB.bodyRecords||[]).filter(x=>x.memberId===s.memberId&&x.date===s.date).at(-1);if(body)lines.push('몸무게: '+body.weight+'kg');
 lines.push('','※ 미완료·실패 세트는 완료 성과에 포함하지 않았습니다.');return lines.join('\n');
}
const shareSession=()=>DB.sessions.find(s=>s.id===(lastComplete||DB.lastCompleted[ROLE]));
function sharePage(){const s=shareSession();if(!s)return header('전달할 운동 기록')+empty('완료한 운동 기록을 선택해 주세요','운동 기록의 상세 화면에서도 전체 내용을 복사할 수 있어요.',btn('오늘로','nav','primary','data-view="home"'));const st=stats(s),questions=s.exercises.filter(e=>e.needsCare&&e.memo).length,photos=s.exercises.flatMap(e=>e.attachments||[]);return `<div class="share-page"><div class="share-success">${icon('check')}</div><div class="share-heading"><h1>오늘의 한 장, 완성.</h1><p>운동 기록과 질문을 한 번에 전달하세요.</p></div><section class="share-overview"><div class="row between"><h2>${esc(s.title)}</h2>${badge('저장 완료','green')}</div><p class="sub">${formatDate(s.date)} · ${esc(member(s.memberId).name)}</p><div class="share-metrics"><div><strong>${st.minutes}</strong><small>운동 시간 · 분</small></div><div><strong>${st.sets}</strong><small>완료 세트</small></div><div><strong>${questions}</strong><small>운동 질문</small></div></div>${s.cardioActivities?.length?`<p class="sub">유산소 ${s.cardioActivities.length}개 기록도 함께 포함했어요.</p>`:''}</section><div class="copy-feedback ${autoCopyStatus==='success'?'success':''}" id="copy-feedback" role="status">${icon(autoCopyStatus==='success'?'check':'note')}<span>${autoCopyStatus==='success'?'자동 복사했어요. 카카오톡 대화방에 붙여넣어 주세요.':autoCopyStatus==='pending'?'전체 기록을 복사하고 있어요…':'복사 버튼을 누르면 모든 기록을 한 번에 담을 수 있어요.'}</span></div><div class="share-buttons">${btn(icon('note')+' 전체 기록 복사','copy-all','primary large')}${btn(icon('upload')+' 공유하기 · 카카오톡 등','native-share','large')}</div><p class="share-help">${navigator.share?'공유 메뉴에서 카카오톡과 대화 상대를 선택해 주세요.':'전체 기록을 복사한 뒤 카카오톡 대화방에 붙여넣어 주세요.'}</p><details class="share-text-panel" open><summary>코치에게 전달할 내용 <span>모든 세트 · 질문 · 유산소</span></summary><textarea id="share-text" readonly aria-label="복사할 전체 운동 기록">${esc(fullSessionText(s))}</textarea></details>${photos.length?`<section class="card mt"><h3>함께 보낼 자세 사진 ${photos.length}장</h3>${photoThumbs(photos)}${btn('사진과 기록 함께 공유','share-photos','w-full mt')}<p class="footnote">사진 공유를 지원하는 휴대폰에서 사용할 수 있어요. 텍스트 복사에는 사진이 포함되지 않습니다.</p></section>`:''}<div class="share-bottom">${btn('운동 결과 보기','show-completion')}${btn('오늘로 돌아가기','nav','','data-view="home"')}</div></div>`}
const renderBeforeShare=render;render=function(){if(view==='workout'&&active()&&!active().exercises.length)view='cardio';if(view==='share'){chrome();$('#page').innerHTML=sharePage();document.title=BRAND+' · 운동 기록 전달';if(!isCoach)applyMemberPhone();return}renderBeforeShare();if(view==='complete')$('.completion-card .card').insertAdjacentHTML('beforeend',btn('전체 기록 · 질문 복사 / 공유','open-share','primary w-full mt'))};
async function copyAll(auto=false){const s=shareSession();if(!s)return false;const text=fullSessionText(s);try{await navigator.clipboard.writeText(text);autoCopyStatus='success';if($('#copy-feedback')){$('#copy-feedback').classList.add('success');$('#copy-feedback').innerHTML=icon('check')+'<span>전체 기록을 복사했어요. 카카오톡 대화방에 붙여넣어 주세요.</span>'}if(!auto)toast('모든 기록과 질문을 복사했어요.');return true}catch{autoCopyStatus='manual';if(!auto){const ta=$('#share-text');if(ta){ta.focus();ta.select();try{if(document.execCommand('copy')){toast('모든 기록과 질문을 복사했어요.');return true}}catch{}toast('내용을 선택했어요. 복사한 뒤 대화방에 붙여넣어 주세요.')} }if($('#copy-feedback'))$('#copy-feedback').innerHTML=icon('note')+'<span>복사 버튼을 눌러 전체 기록을 복사해 주세요.</span>';return false}}
const beforeShareHandle=handle;handle=function(a,d,el){if(a==='copy-all'){copyAll();return}if(a==='open-share'){lastComplete=d.id||lastComplete||DB.lastCompleted[ROLE];go('share');return}if(a==='show-completion'){go('complete');return}if(a==='native-share'){const s=shareSession();if(!s)return;if(navigator.share){navigator.share({title:member(s.memberId).name+'님의 운동 기록',text:fullSessionText(s)}).catch(err=>{if(err.name!=='AbortError'){toast('공유 메뉴를 열지 못했어요. 전체 기록 복사를 이용해 주세요.')}})}else copyAll();return}if(a==='share-photos'){const s=shareSession();const attachments=s.exercises.flatMap(e=>e.attachments||[]);const files=attachments.filter(validPhoto).map(p=>{const raw=atob(p.data.split(',')[1]),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return new File([bytes],p.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'})});if(navigator.canShare?.({files}))navigator.share({title:'운동 자세 피드백',text:fullSessionText(s),files}).catch(e=>{if(e.name!=='AbortError')toast('사진 공유를 열지 못했어요.')});else modal('사진을 따로 보관해 주세요',`<p class="sub">이 브라우저는 사진 파일 공유를 지원하지 않아요. 사진을 내려받아 카카오톡에서 첨부할 수 있습니다.</p><div class="stack">${attachments.map(p=>`<a class="btn" download="${esc(p.name)}" href="${p.data}">${icon('download')}${esc(p.name)}</a>`).join('')}</div>`);return}if(a==='copy-summary'){lastComplete=d.id;go('share');copyAll();return}beforeShareHandle(a,d,el)};
document.addEventListener('submit',e=>{if(e.target.dataset.form!=='finish'||active()||!lastComplete)return;DB.lastCompleted[ROLE]=lastComplete;save();autoCopyStatus='pending';go('share');copyAll(true)});

function modeCourses(){if(cardioMode==='treadmill')return COURSE_NAMES;if(cardioMode==='outdoorRun')return [['자유 달리기','자유',0],['가볍게 15분','지구력',15],['20분 달리기','지구력',20],['런워크 1:1','런워크',12]];if(cardioMode==='outdoorCycle')return [['자유 라이딩','자유',0],['편안한 페이스 30','지구력',30],['60분 꾸준히','지구력',60]];if(cardioMode==='mountain')return [['자유 경사 걷기','자유',0],...Array.from({length:7},(_,i)=>[`마이마운틴 ${i+1}단계`,i<3?'입문':'경사',15]),['핸즈프리 15분','핸즈프리',15],['핸즈프리 20분','핸즈프리',20]];if(cardioMode==='stairs')return [['자유 계단 오르기','자유',0],['지속시간 +1분','지구력',11],['안정적인 20분','핸즈프리',20],['레벨 업 10분','레벨',10]];return [['자유 사이클','자유',0],['편안한 페이스 20분','지구력',20],['RPM 유지 15분','케이던스',15],['1 / 1 인터벌','인터벌',16],['저항 유지 12분','저항',12]]}
courseDialog=function(mode){cardioMode=mode;courseFilter='전체';courseSearch='';const m=CARDIO_MODES.find(m=>m.id===mode),filters=['전체',...new Set(modeCourses().map(c=>c[1])),'즐겨찾기','챌린지'];const previous=memberHistory(active()?.memberId||selectedMember||'m1').flatMap(s=>(s.cardioActivities||[]).filter(c=>c.mode===mode)).slice(0,1);modal(m.name+' · 코스 선택',`<div class="cardio-library-intro"><div class="exercise-icon">${icon(m.icon)}</div><div><h3>${m.name}</h3><p class="sub">${m.sub}</p></div>${badge(modeCourses().length+'개 코스','green')}</div>${previous.length?`<div class="notice info mb">지난 기록 · ${fmt(previous[0].seconds)}${previous[0].distance?' · '+previous[0].distance+'km':''}</div>`:''}<div class="search">${icon('search')}<input id="course-search" placeholder="코스 이름이나 분류로 찾기" aria-label="유산소 코스 검색"></div><div class="filter-chips">${filters.map(t=>`<button class="filter-chip ${t==='전체'?'active':''}" data-action="course-filter" data-id="${t}">${t}</button>`).join('')}</div><div id="course-results">${courseResults()}</div>`,true)};
courseResults=function(){DB.favoriteCourses??=[];return modeCourses().map(([name,part,minutes],i)=>({id:'course'+i,name,part,minutes})).filter(c=>(courseFilter==='전체'||courseFilter==='즐겨찾기'&&DB.favoriteCourses.includes(cardioMode+':'+c.id)||courseFilter==='챌린지'&&c.minutes>=10||c.part===courseFilter)&&(!courseSearch||(c.name+c.part).includes(courseSearch))).map(c=>`<div class="exercise-row cardio-course-row"><div class="course-time"><strong>${c.minutes||'∞'}</strong><small>${c.minutes?'분':'자유'}</small></div><div class="grow"><h3>${esc(c.name)}</h3><p class="sub">${c.part}${courseFilter==='챌린지'?' · 목표 달성 도전':''}</p></div><button class="favorite-btn ${DB.favoriteCourses.includes(cardioMode+':'+c.id)?'selected':''}" data-action="course-favorite" data-id="${c.id}" aria-label="${c.name} 즐겨찾기">${DB.favoriteCourses.includes(cardioMode+':'+c.id)?'★':'☆'}</button>${btn('시작','course-start','soft sm',`data-id="${c.id}"`)}</div>`).join('')||empty('해당하는 코스가 없어요','검색어나 필터를 바꿔 주세요.')};
function courseStages(c){const seconds=c.course.minutes*60,name=c.course.name;if(!seconds)return [{label:'자유로운 페이스',seconds:86400}];if(c.mode==='treadmill'||c.mode==='outdoorRun'){if(/런워크/.test(name)){const run=name.includes('3:1')?180:name.includes('2:1')?120:60;return Array.from({length:Math.ceil(seconds/(60+run))},()=>[{label:'걷기',seconds:60},{label:'가벼운 달리기',seconds:run}]).flat()}if(/인터벌/.test(name))return Array.from({length:Math.ceil(seconds/120)},()=>[{label:'편안한 페이스',seconds:60},{label:'빠른 페이스',seconds:60}]).flat()}
const warm=Math.max(60,Math.floor(seconds*.15/30)*30);return [{label:'천천히 몸 풀기',seconds:warm},{label:c.mode==='indoorCycle'?'나의 페이스 유지':c.mode==='mountain'?'경사 걷기':c.mode==='stairs'?'안정적인 오르기':'꾸준히 이어가기',seconds:seconds-warm*2},{label:'가볍게 마무리',seconds:warm}]}
function stageAt(c,sec){const stages=courseStages(c);let cursor=0;for(let i=0;i<stages.length;i++){if(sec<cursor+stages[i].seconds)return {...stages[i],index:i,remaining:cursor+stages[i].seconds-sec,next:stages[i+1]?.label};cursor+=stages[i].seconds}return {label:'목표 시간 완료',index:stages.length,remaining:0,next:null}}
const basicCardioPage=cardioPage;cardioPage=function(){let html=basicCardioPage();const c=active()?.activeCardio;if(!c)return html;const sec=cardioSeconds(),stage=stageAt(c,sec);return html.replace('<div class="cardio-clock-face">',`<div class="course-stage-line"><span class="dot"></span><strong data-stage-name>${stage.label}</strong><span data-stage-remaining>${c.course.minutes?fmt(stage.remaining):'자유 운동'}</span></div><div class="cardio-clock-face">`).replace('<p class="footnote">이 타이머는',`<div class="course-progress"><span data-stage-next>${stage.next?'다음 · '+stage.next:'내 몸 상태에 맞춰 진행해요'}</span>${btn('코스 구성 보기','course-structure','sm')}</div><p class="footnote">이 타이머는`)};
const beforeCardioPolishHandle=handle;handle=function(a,d,el){if(a==='course-start'){const i=+d.id.replace('course',''),x=modeCourses()[i];selectedCourse={id:d.id,name:x[0],part:x[1],minutes:x[2],requiresHandsFree:x[1]==='핸즈프리'};if(active())beginCardio();else modal('시작 전, 몸 상태를 확인해요',`<form data-form="cardio-checkin"><label>오늘의 컨디션<select name="condition"><option>좋음</option><option>보통</option><option>피곤함</option></select></label><div class="dialog-actions">${btn('유산소 시작','submit','primary')}</div></form>`);return}if(a==='course-structure'){const c=active().activeCardio;modal(esc(c.course.name),`<p class="sub">기구 설정은 몸 상태에 맞춰 직접 조절해 주세요.</p><div>${courseStages(c).map((s,i)=>`<div class="exercise-row"><span class="badge">${i+1}</span><strong class="grow">${s.label}</strong><span class="muted">${s.seconds===86400?'자유':fmt(s.seconds)}</span></div>`).join('')}</div><p class="footnote">시간 구간을 안내하는 코스입니다. 기구나 센서를 자동 제어하지 않습니다.</p>`);return}beforeCardioPolishHandle(a,d,el)};
setInterval(()=>{const c=active()?.activeCardio;if(!c)return;const s=stageAt(c,cardioSeconds());if($('[data-stage-name]'))$('[data-stage-name]').textContent=s.label;if($('[data-stage-remaining]'))$('[data-stage-remaining]').textContent=c.course.minutes?fmt(s.remaining):'자유 운동';if($('[data-stage-next]'))$('[data-stage-next]').textContent=s.next?'다음 · '+s.next:'내 몸 상태에 맞춰 진행해요'},1000);

const scheduleMinutes=t=>+t.slice(0,2)*60+ +t.slice(3,5),scheduleTime=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
const mondayIndex=d=>(new Date(d+'T12:00:00').getDay()+6)%7;
function ruleDates(rule,start,end){const dates=[];let d=start>rule.start?start:rule.start;if(rule.until&&rule.until<end)end=rule.until;d=dayOffset((rule.weekday-mondayIndex(d)+7)%7,d);for(;d<=end;d=dayOffset(7,d))dates.push(d);return dates}
function expandSchedule(rules=DB.recurringSchedules,appointments=DB.appointments,start=TODAY,end=dayOffset(84),cancelled=DB.cancelledOccurrences){const out=clone(appointments);for(const r of rules){for(const date of ruleDates(r,start,end)){const key=r.id+':'+date;if(cancelled.includes(key)||out.some(a=>a.seriesId===r.id&&(a.occurrenceDate||a.date)===date))continue;out.push({id:key,memberId:r.memberId,date,time:r.time,topic:r.topic,status:'scheduled',seriesId:r.id,occurrenceDate:date})}}return out}
function ensureSchedule(start,end){const expanded=expandSchedule(DB.recurringSchedules,DB.appointments,start,end);if(expanded.length!==DB.appointments.length){DB.appointments=expanded;save()}}
function scheduleConflict(items){const sorted=[...items].sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));for(let i=1;i<sorted.length;i++){const a=sorted[i-1],b=sorted[i];if(a.date===b.date&&scheduleMinutes(b.time)-scheduleMinutes(a.time)<50)return [a,b]}return null}
function recurringConflict(rules){for(let i=0;i<rules.length;i++)for(let j=i+1;j<rules.length;j++){const a=rules[i],b=rules[j];if(a.weekday!==b.weekday||Math.abs(scheduleMinutes(a.time)-scheduleMinutes(b.time))>=50)continue;const start=a.start>b.start?a.start:b.start,end=[a.until,b.until].filter(Boolean).sort()[0]||'9999-12-31';if(ruleDates(a,start,dayOffset(6,start)).some(d=>d<=end))return [a,b]}return null}
function commitSchedule(rules,appointments,cancelled=DB.cancelledOccurrences){const rclash=recurringConflict(rules);if(rclash){toast('매주 '+ '월화수목금토일'[rclash[0].weekday]+'요일의 고정 수업과 시간이 겹쳐요.');return false}let horizon=dayOffset(84);for(const a of appointments)if(a.date>horizon)horizon=a.date;for(const r of rules)if(r.start>horizon)horizon=dayOffset(84,r.start);const expanded=expandSchedule(rules,appointments,TODAY,horizon,cancelled),clash=scheduleConflict(expanded);if(clash){toast(formatDate(clash[0].date,{month:'numeric',day:'numeric'})+' '+clash[0].time+' · '+member(clash[0].memberId).name+'님 수업과 겹쳐요. 변경하지 않았어요.');return false}DB.recurringSchedules=rules;DB.appointments=expanded;DB.cancelledOccurrences=cancelled;save();closeModal();render();toast('수업 일정을 저장했어요.');return true}

appointmentDialog=function(d={}){const a=DB.appointments.find(a=>a.id===d.id);if(a?.status==='completed'){toast('완료된 수업은 날짜와 시간을 바꾸지 않아요.');return}const date=a?.date||d.date||TODAY;modal(a?'수업 일정 수정':'새 수업 등록',`<form data-form="recurring-appointment"><input type="hidden" name="id" value="${a?.id||''}"><label>회원<select name="memberId">${DB.members.map(m=>`<option value="${m.id}" ${m.id===(a?.memberId||selectedMember)?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label><div class="form-grid"><label>${a?'수업 날짜':'시작 날짜'}<input type="date" name="date" value="${date}" required></label><label>시작 시간<input type="time" name="time" value="${a?.time||d.time||'10:00'}" min="09:00" max="21:00" step="1800" required></label></div>${a?.seriesId?`<p class="notice info">매주 고정 수업이에요. 저장할 때 이번 수업만 바꿀지, 앞으로의 고정 일정도 바꿀지 선택해요.</p>`:!a?`<fieldset class="schedule-repeat"><legend>반복 설정</legend><label class="checkline"><input type="checkbox" name="repeat" checked>매주 같은 요일·시간에 고정</label><p class="sub">수업할 요일을 모두 선택해 주세요.</p><div class="schedule-weekdays">${Array.from('월화수목금토일').map((t,i)=>`<label><input type="checkbox" name="weekdays" value="${i}" ${i===mondayIndex(date)?'checked':''}><span>${t}</span></label>`).join('')}</div><p class="footnote">고정을 끄면 시작 날짜가 속한 주의 선택 요일에 한 번씩 등록해요.</p></fieldset>`:''}<label>수업 주제<input name="topic" maxlength="50" required value="${esc(a?.topic||'하체 · 코어')}"></label><p class="sub">수업은 50분 단위예요. 겹치는 일정은 저장하지 않아요.</p><div class="dialog-actions">${btn('취소','close-modal')}${btn(a?'변경 확인':'수업 등록','submit','primary')}</div></form>`)};

function applyScheduleMove(all){const d=pendingScheduleMove,a=DB.appointments.find(a=>a.id===d?.id);if(!a)return;const rules=clone(DB.recurringSchedules),appointments=clone(DB.appointments),target=appointments.find(x=>x.id===a.id);if(!all||!a.seriesId){Object.assign(target,{date:d.date,time:d.time,memberId:d.memberId||a.memberId,topic:d.topic||a.topic,...(a.seriesId?{exception:true}:{})});if(commitSchedule(rules,appointments))pendingScheduleMove=null;return}const old=rules.find(r=>r.id===a.seriesId);if(!old)return;const originalUntil=old.until,cutoff=a.occurrenceDate||a.date;old.until=dayOffset(-1,cutoff);const newRule={id:uid(),groupId:old.groupId,memberId:d.memberId||a.memberId,weekday:mondayIndex(d.date),time:d.time,topic:d.topic||a.topic,start:d.date,...(originalUntil?{until:originalUntil}:{})};rules.push(newRule);const retained=appointments.filter(x=>x.id===a.id||x.seriesId!==a.seriesId||(x.occurrenceDate||x.date)<cutoff||x.status==='completed'||x.exception);Object.assign(target,{date:d.date,time:d.time,memberId:newRule.memberId,topic:newRule.topic,seriesId:newRule.id,occurrenceDate:d.date,exception:false});if(commitSchedule(rules,retained))pendingScheduleMove=null}
document.addEventListener('submit',e=>{if(e.target.dataset.form!=='recurring-appointment')return;e.preventDefault();const f=new FormData(e.target),d=Object.fromEntries(f),start=scheduleMinutes(d.time);if(start<540||start>1260||start%30){toast('시작 시간은 09:00~21:00 사이에서 30분 단위로 선택해 주세요.');return}if(d.id){requestScheduleMove(d.id,d.date,d.time,{memberId:d.memberId,topic:d.topic.trim()});return}const weekdays=f.getAll('weekdays').map(Number);if(!weekdays.length){toast('수업할 요일을 한 개 이상 선택해 주세요.');return}const rules=clone(DB.recurringSchedules),appointments=clone(DB.appointments),groupId=uid();for(const weekday of weekdays){if(f.has('repeat'))rules.push({id:uid(),groupId,memberId:d.memberId,weekday,time:d.time,topic:d.topic.trim(),start:d.date});else{const date=dayOffset(weekday-mondayIndex(d.date),d.date);appointments.push({id:uid(),memberId:d.memberId,date,time:d.time,topic:d.topic.trim(),status:'scheduled'})}}commitSchedule(rules,appointments)});
const scheduleHandle=handle;handle=function(a,d,el){if(a==='schedule-day'){scheduleMobileDayIndex=Math.max(0,Math.min(6,+d.index));render();return}if(a==='week-today')scheduleMobileDayIndex=mondayIndex(TODAY);if(a==='schedule-move-once'){applyScheduleMove(false);return}if(a==='schedule-move-series'){applyScheduleMove(true);return}if(a==='confirm-cancel-appointment'){const x=DB.appointments.find(a=>a.id===d.id);if(x?.seriesId)DB.cancelledOccurrences.push(x.seriesId+':'+(x.occurrenceDate||x.date))}scheduleHandle(a,d,el)};

let calendarDrag=null,calendarClickUntil=0;
function calendarDropAt(x,y){const cell=document.elementFromPoint(x,y)?.closest('.cal-cell,.schedule-mobile-cell');if(!cell)return null;const r=cell.getBoundingClientRect(),mins=+cell.dataset.hour*60+(y-r.top>=39?30:0);if(mins>1260)return null;return {cell,date:cell.dataset.date,time:scheduleTime(mins),offset:mins%60===30?39:0}}

document.addEventListener('pointerdown',e=>{const el=e.target.closest('.cal-event');if(!el||e.button>0||view!=='schedule'||!isCoach)return;const a=DB.appointments.find(a=>a.id===el.dataset.id);if(!a||a.status==='completed')return;calendarDrag={event:el,id:e.pointerId,appointmentId:a.id,x:e.clientX,y:e.clientY,startX:e.clientX,startY:e.clientY,touch:e.pointerType==='touch',started:false};if(e.pointerType==='touch')calendarDrag.timer=setTimeout(startCalendarDrag,300)});

function exerciseBests(e,memberId){const rows=memberHistory(memberId).flatMap(s=>s.exercises.filter(x=>x.id===e.id&&!x.skipped).flatMap(x=>x.sets.map((set,index)=>({set,index,date:s.date,demo:s.demo})).filter(x=>x.set.status==='done'&&x.set.kind!=='warmup')));const maxBy=fn=>rows.filter(r=>Number.isFinite(fn(r))).sort((a,b)=>fn(b)-fn(a)||b.date.localeCompare(a.date))[0];if(e.type==='weight')return [{label:'이전 최고 무게',row:maxBy(r=>+r.set.weight),value:r=>num(r.set.weight)+'kg',detail:r=>`${r.set.weight}kg × ${r.set.reps}회`},{label:'이전 최고 볼륨',row:maxBy(r=>+r.set.weight*+r.set.reps),value:r=>num(+r.set.weight*+r.set.reps)+'kg',detail:r=>`${r.set.weight}kg × ${r.set.reps}회`}];if(e.type==='assist')return [{label:'이전 최소 보조무게',row:maxBy(r=>-Number(r.set.weight)),value:r=>num(r.set.weight)+'kg',detail:r=>`보조 ${r.set.weight}kg × ${r.set.reps}회`},{label:'이전 최다 반복',row:maxBy(r=>+r.set.reps),value:r=>r.set.reps+'회',detail:r=>`보조 ${r.set.weight}kg × ${r.set.reps}회`}];const key=e.type==='reps'?'reps':e.type==='distance'?'distance':'duration';return [{label:e.type==='reps'?'이전 최다 반복':e.type==='distance'?'이전 최장 거리':'이전 최장 시간',row:maxBy(r=>+r.set[key]),value:r=>key==='duration'?fmt(+r.set[key]):num(r.set[key])+(key==='reps'?'회':'m'),detail:r=>`${r.index+1}세트 기록`}];}

function coachNoteDefaults(x){const notes={...(x.details||{})};const legacy={0:[x.discomfort,x.reported].filter(Boolean).join('\n'),3:x.adjustments,6:x.followup};for(const [i,text] of Object.entries(legacy))if(text&&!notes[COACH_CHECKS[+i][0]])notes[COACH_CHECKS[+i][0]]=text;return notes}
