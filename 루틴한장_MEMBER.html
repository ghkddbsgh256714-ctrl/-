const RoutineService={
 items(r){return r.items?clone(r.items):r.ids.map(id=>this.itemFromExercise(mkEx(id)))},
 itemFromExercise(e){const last=e.sets?.filter(s=>s.status==='done'&&s.kind!=='warmup').at(-1)||e.sets?.[0]||{};return {id:uid(),exerciseId:e.id,phase:e.phase||'본 운동',sets:Math.max(1,e.sets?.length||e.count||3),weight:last.weight!==''&&last.weight!=null?+last.weight:e.weight||0,reps:last.reps!==''&&last.reps!=null?+last.reps:e.reps||8,duration:last.duration!==''&&last.duration!=null?+last.duration:e.duration||40,distance:last.distance!==''&&last.distance!=null?+last.distance:e.distance||30,rest:e.defaultRest||90,note:''}},
 draftFromSession(s){return {id:uid(),title:member(s.memberId).name+'님 · 수업 복습',subtitle:'PT 복습 · 개인운동',minutes:40,note:'수업에서 배운 동작을 내 페이스로 복습해요.',memberId:s.memberId,sourceSessionId:s.id,revision:0,items:s.exercises.filter(e=>!e.skipped&&e.type!=='cardio').map(e=>this.itemFromExercise(e))}},
 saveDraft(d){if(!d.title.trim()||!d.items.length)throw Error('루틴 이름과 운동을 한 개 이상 입력해 주세요.');for(const x of d.items){if(!LIB.some(e=>e.id===x.exerciseId)||!Number.isInteger(x.sets)||x.sets<1||x.sets>30||x.rest<10||x.rest>600)throw Error('세트는 1~30개, 휴식은 10~600초로 입력해 주세요.');const e=LIB.find(e=>e.id===x.exerciseId);for(const f of metricFields(e)){if(!Number.isFinite(+x[f.key])||+x[f.key]<f.min||+x[f.key]>f.max)throw Error(e.name+' 목표값을 확인해 주세요.')}}const existing=DB.routines.find(r=>r.id===d.id),revision=(existing?.revision||0)+1,record={...clone(d),ids:d.items.map(x=>x.exerciseId),revision,revisionId:uid(),level:d.subtitle};DB.routineRevisions.push(clone(record));if(existing)DB.routines[DB.routines.indexOf(existing)]=record;else DB.routines.push(record);delete DB.personalPlanDrafts[d.id];DB.coachingAudit.push({id:uid(),action:'routine.revision.saved',routineId:record.id,revisionId:record.revisionId,at:Date.now()});save();return record},
 publish(r,memberId,start,note){if(!DB.members.some(m=>m.id===memberId))throw Error('받을 회원을 선택해 주세요.');const prior=DB.assignments.find(a=>a.routine.revisionId&&a.routine.revisionId===r.revisionId&&a.memberId===memberId&&a.start===start&&a.routine.note===(note||r.note));if(prior)return prior;const assignment={id:uid(),memberId,routine:{...clone(r),note:note||r.note},start,sourceSessionId:r.sourceSessionId||null,createdAt:Date.now(),delivery:'local'};DB.assignments.push(assignment);DB.coachingAudit.push({id:uid(),action:'routine.assignment.published',assignmentId:assignment.id,memberId,at:Date.now()});save();return assignment},
 exercises(r){return this.items(r).map(x=>{const e=mkEx(x.exerciseId);Object.assign(e,{phase:x.phase,count:x.sets,weight:x.weight,reps:x.reps,duration:x.duration,distance:x.distance,defaultRest:x.rest,cue:x.note||e.cue,plannedItemId:x.id});e.sets=Array.from({length:x.sets},()=>({weight:'',reps:'',duration:'',distance:'',status:'pending',kind:'normal'}));return e})}

function planEditor(){if(!personalPlan)return;modal('개인운동 루틴 편집',`<p class="sub">수업 기록은 그대로 두고, 개인운동 목표를 별도로 구성해요.</p><form data-form="personal-plan"><label>루틴 이름<input name="title" value="${esc(personalPlan.title)}" required maxlength="60"></label><div class="form-grid"><label>분류<input name="subtitle" value="${esc(personalPlan.subtitle)}" required maxlength="50"></label><label>예상 시간 (분)<input name="minutes" type="number" min="5" max="240" value="${personalPlan.minutes}" required></label></div><div id="plan-items">${planItemRows()}</div><label>운동 추가<select id="plan-add-exercise"><option value="">운동을 선택하세요</option>${LIB.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label><label>회원에게 남길 가이드<textarea name="note" maxlength="1500">${esc(personalPlan.note)}</textarea></label><div class="finish-choice-actions">${btn('루틴 저장 · 회원 전송 준비','submit','primary w-full')}${btn('초안으로 보관','keep-personal-draft','w-full')}</div><p class="footnote">초안은 자동 보관돼요. 저장한 후 받는 회원과 내용을 확인해 전송합니다.</p></form>`,true)}
function planItemRows(){return personalPlan.items.map((x,i)=>{const e=LIB.find(e=>e.id===x.exerciseId);return `<section class="plan-item"><div class="row between"><h3>${i+1}. ${esc(e.name)}</h3><div class="row" style="gap:1px">${ib('up','plan-move','앞으로',`data-index="${i}" data-dir="-1" ${i===0?'disabled':''}`)}${ib('down','plan-move','뒤로',`data-index="${i}" data-dir="1" ${i===personalPlan.items.length-1?'disabled':''}`)}${ib('trash','plan-remove','루틴에서 운동 삭제',`data-index="${i}"`)}</div></div><div class="plan-item-fields"><label>세트<input type="number" data-plan-index="${i}" data-plan-field="sets" min="1" max="30" value="${x.sets}" required></label>${metricFields(e).map(f=>`<label>${f.label}<input type="number" data-plan-index="${i}" data-plan-field="${f.key}" min="${f.min}" max="${f.max}" step="any" value="${x[f.key]}" required></label>`).join('')}<label>휴식 · 초<input type="number" data-plan-index="${i}" data-plan-field="rest" min="10" max="600" value="${x.rest}" required></label></div><label>운동 가이드<input data-plan-index="${i}" data-plan-field="note" value="${esc(x.note)}" maxlength="500" placeholder="이 운동에서 기억할 점"></label></section>`}).join('')||empty('운동을 추가해 주세요','오늘 복습할 운동부터 하나씩 골라요.')}

function surveyRoutine(profile){

 const old=DB.routines.find(r=>r.id==='ai-m1'),routine={id:'ai-m1',title,subtitle,level:'AI 맞춤',minutes:+profile.minutes,ids,note:'첫 세트는 편안한 강도로 시작하고, 같은 자세를 유지할 수 있는 범위에서 진행해요.',revision:(old?.revision||0)+1,aiGenerated:true,generatedAt:Date.now()};

function workoutPhase(e){if(!e)return '운동';if(e.phase==='스트레칭'||e.part==='회복'&&e.phase!=='마무리')return '스트레칭';if(e.phase==='기능성 운동'||e.part==='기능성'||e.phase==='준비 운동'&&e.type!=='cardio')return '기능성';if(e.type==='cardio'||e.part==='유산소')return e.phase==='준비 운동'?'워밍업':'유산소';if(e.phase==='마무리')return '마무리';return '웨이트'}

function journeyPhase(e){if(!isCoach)return workoutPhase(e);if(e.sessionBlock==='warmup')return '워밍업';if(e.sessionBlock==='main')return '본운동';if(e.sessionBlock==='finish')return '마무리 운동';if(['준비 운동','기능성 운동'].includes(e.phase)||e.type==='cardio'&&e.phase==='준비 운동')return '워밍업';if(['마무리','스트레칭'].includes(e.phase)||e.part==='회복')return '마무리 운동';return '본운동'}
function phaseJourney(exercises,current=-1){const phases=[];exercises.forEach((e,i)=>{const name=journeyPhase(e),last=phases.at(-1);if(!last||last.name!==name)phases.push({name,start:i,items:[e]});else last.items.push(e)});return `<div class="phase-journey" aria-label="운동 단계">${phases.map((p,i)=>{const completed=p.items.every(e=>e.skipped||e.sets.every(s=>s.status!=='pending')),active=current>=p.start&&current<p.start+p.items.length;return `<button class="phase-step ${phaseTone(p.name)} ${completed?'done':''} ${active?'active':''}" data-action="select-exercise" data-index="${p.start}" ${current<0?'disabled':''}><span>${completed?icon('check'):i+1}</span><strong>${esc(p.name)}</strong><small>${p.items.length}개</small></button>`}).join('')}</div>`}

function classManagementPage(){if(!isCoach)return memberHome();const mid=DB.members.some(m=>m.id===classManagerMember)?classManagerMember:DB.members[0].id,m=member(mid),rows=classHistory(mid),last=rows[0],next=nextAppointment(mid);return header('수업 관리','지난 수업의 맥락을 확인하고 다음 수업을 한 흐름에서 준비하세요.',btn(icon('plus')+' 수업 등록','appointment','primary'))+classMemberRail(mid)+`<section class="class-manager-hero"><div><span class="eyebrow">NEXT CLASS</span><h2>${esc(m.name)}님의 ${upcomingPT(mid)}</h2><p>${next?formatDate(next.date,{month:'long',day:'numeric'})+' '+next.time+' 예정 · ':''}${esc(m.goal)}</p><div class="class-hero-facts"><span><strong>${rows.length}</strong> 완료 수업</span><span><strong>${m.remaining}</strong> 남은 PT</span><span><strong>${last?stats(last).sets:0}</strong> 지난 세트</span></div></div><div class="class-hero-actions">${last?btn('지난 수업으로 빠르게 준비','prepare-from-session','light large',`data-id="${last.id}"`):''}${btn('새 수업 구성하기 '+icon('arrow'),'prepare','primary large',`data-member="${mid}"`)}</div></section><div class="detail-split class-manager-grid">${classTimeline(mid)}${classReference(mid)}</div>`}

function coachCompactCalendar(mode){
 const dates=mode==='day'?[coachCalendarDate]:calendarSpanForCoach(mode),items=DB.appointments||[];
 if(mode==='month'){const selected=calendarDate(coachCalendarDate),first=new Date(selected.getFullYear(),selected.getMonth(),1,12),start=new Date(first);start.setDate(1-first.getDay());return `<section class="member-month card coach-month"><div class="member-weekdays">${['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')}</div><div class="member-month-grid">${Array.from({length:42},(_,i)=>{const d=new Date(start);d.setDate(start.getDate()+i);const iso=localDate(d),count=items.filter(a=>a.date===iso).length;return `<button class="member-cal-day ${d.getMonth()!==selected.getMonth()?'outside':''} ${iso===TODAY?'today':''}" data-action="coach-calendar-date" data-date="${iso}"><time>${d.getDate()}</time>${count?`<b>${count}수업</b>`:''}</button>`}).join('')}</div></section>`}
 return `<section class="coach-agenda-grid ${mode}">${dates.map(date=>{const rows=items.filter(a=>a.date===date).sort((a,b)=>a.time.localeCompare(b.time));return `<article class="coach-agenda-day ${date===TODAY?'today':''}"><button class="span-date" data-action="coach-calendar-date" data-date="${date}"><small>${calendarDate(date).toLocaleDateString('ko-KR',{weekday:'short'})}</small><strong>${+date.slice(8)}</strong><span>${rows.length}수업</span></button><div>${rows.map(coachAppointmentSummary).join('')||'<p>예정 없음</p>'}</div></article>`}).join('')}</section>`;
}
function calendarSpanForCoach(mode){const count=mode==='five'?5:7,start=mode==='week'?dayOffset(-calendarDate(coachCalendarDate).getDay(),coachCalendarDate):coachCalendarDate;return Array.from({length:count},(_,i)=>dayOffset(i,start))}
function coachCalendarTitle(){return coachCalendarMode==='month'?calendarMonthTitle(coachCalendarDate):coachCalendarMode==='week'?'주간 수업 시간표':calendarShortDate(coachCalendarDate)}
schedulePage=function(){
 let content;if(coachCalendarMode==='week'){const box=document.createElement('div');box.innerHTML=coachScheduleBase();box.querySelector('.page-header')?.remove();content=box.innerHTML}else content=coachCompactCalendar(coachCalendarMode);
 return header('수업 캘린더','1일·5일·일주일·월간을 바꾸고, 주간 시간표에서는 30분 단위로 수업을 옮겨요.',btn(icon('plus')+' 수업 등록','appointment','primary'))+`<section class="calendar-control card coach-calendar-control"><div class="calendar-period"><button class="icon-btn" data-action="coach-calendar-move" data-dir="-1" aria-label="이전 기간">${icon('back')}</button><button class="calendar-title" data-action="coach-calendar-today"><strong>${coachCalendarTitle()}</strong><small>오늘로 이동</small></button><button class="icon-btn" data-action="coach-calendar-move" data-dir="1" aria-label="다음 기간">${icon('chevron')}</button></div>${calendarModeSelect('coach',coachCalendarMode)}</section>${content}`;
};

function previousExerciseForDraft(session,index){const src=session?.exercises?.filter(e=>!e.skipped)[index];if(!src)return null;const e=mkEx(src.id)||clone(src);e.sets=(src.sets||[]).map(s=>({...clone(s),status:'pending'}));e.sessionBlock=classBlock(src);delete e.skipped;return e}
function prepHistoryShelf(dr){const rows=classHistory(dr.memberId).slice(0,3);return `<section class="prep-history-shelf"><div class="row between"><div><span class="eyebrow">PREVIOUS CLASSES</span><h3>최근 수업에서 가져오기</h3></div><small>운동 하나 또는 전체 구성</small></div>${rows.length?`<div class="prep-history-grid">${rows.map(s=>{const exercises=s.exercises.filter(e=>!e.skipped);return `<article><div class="prep-history-head"><div><strong>${s.ptOrdinal?'PT '+s.ptOrdinal+'회차':formatDate(s.date,{month:'numeric',day:'numeric'})}</strong><small>${formatDate(s.date,{month:'numeric',day:'numeric'})} · ${stats(s).sets}세트</small></div>${btn('전체 추가','prior-session-add','soft sm',`data-id="${s.id}"`)}</div><div class="prep-history-exercises">${exercises.slice(0,6).map((e,i)=>`<button data-action="prior-exercise-add" data-id="${s.id}" data-index="${i}"><span class="prep-block ${classBlock(e)}">${classBlockLabel(classBlock(e))}</span><strong>${esc(e.name)}</strong><small>${esc(bestSetText(e))}</small>${icon('plus')}</button>`).join('')}</div></article>`}).join('')}</div>`:'<p class="sub">완료한 이전 수업이 쌓이면 여기서 바로 가져올 수 있어요.</p>'}</section>`}

phaseComposer=function(dr){const counts={warmup:0,main:0,finish:0};dr.exercises.forEach(e=>counts[classBlock(e)]++);return `<section class="phase-composer"><div class="row between"><div><span class="eyebrow">SESSION FLOW</span><h3>워밍업부터 마무리까지</h3></div>${btn('순서 자동 정리','phase-auto-order','sm')}</div><div class="phase-compose-grid">${[['warmup','워밍업','가벼운 유산소 · 가동성 · 기능성'],['main','본운동','근력 · 기능성 · 코어 · 유산소'],['finish','마무리 운동','유산소 · 스트레칭 · 폼롤러']].map(([id,title,sub],i)=>`<button data-action="phase-add" data-id="${id}" class="phase-compose-card"><span>${i+1}</span><div><strong>${title}</strong><small>${sub}</small></div><b>${counts[id]}개 ${icon('plus')}</b></button>`).join('')}</div></section>`};
let phaseQuickTopic='전체';
phaseQuickDialog=function(block,topic='전체'){phaseQuickTopic=topic;const ids=block==='warmup'?['tw','band-walk','balance-reach','db']:block==='finish'?['tw','stretch','foam','pl']:['sq','rd','lp','lc','bp','lr','sr','pu','pl','fc'],all=ids.map(id=>LIB.find(x=>x.id===id)).filter(Boolean),topics=['전체',...new Set(all.map(e=>e.part==='회복'?(e.id==='foam'?'폼롤러':'스트레칭'):e.type==='cardio'?'유산소':e.part))],shown=topic==='전체'?all:all.filter(e=>(e.part==='회복'?(e.id==='foam'?'폼롤러':'스트레칭'):e.type==='cardio'?'유산소':e.part)===topic);modal(classBlockLabel(block)+' 빠른 추가',`<p class="sub">주제를 고른 뒤 필요한 운동만 오늘 수업에 담으세요.</p><div class="phase-topic-chips">${topics.map(x=>`<button class="${x===topic?'active':''}" data-action="phase-topic" data-id="${block}" data-topic="${x}">${x}</button>`).join('')}</div><div class="phase-quick-list">${shown.map(e=>`<button data-action="phase-quick-add" data-id="${e.id}" data-block="${block}"><span class="exercise-icon">${icon(e.type==='cardio'?'run':'dumbbell')}</span><span class="grow"><strong>${esc(e.name)}</strong><small>${esc(e.phase)} · ${exercisePrescription(e)}</small></span>${icon('plus')}</button>`).join('')}</div>${btn('전체 운동에서 고르기','phase-picker','w-full mt',`data-block="${block}"`)}`)};
const compactEnhanceBase=enhanceClassPreparation;
enhanceClassPreparation=function(){compactEnhanceBase();if(!isCoach||view!=='prep'||!getDraft())return;const list=$('#prep-list');if(list&&!$('.prep-history-shelf'))list.insertAdjacentHTML('beforebegin',prepHistoryShelf(getDraft()))};

document.addEventListener('change',e=>{const role=e.target.dataset.calendarRole;if(!role)return;if(role==='member'){memberCalendarMode=e.target.value;render()}else{coachCalendarMode=e.target.value;if(coachCalendarMode==='week')weekOffset=0;render()}});

const compactExperienceHandle=handle;
handle=function(a,d={},el){
 if(a==='lifestyle'){compactLifestyleDialog(d.date||TODAY);return}
 if(a==='photo-view'){const p=(DB.lifestyle||[]).flatMap(x=>x.attachments||[]).find(p=>p.id===d.photoId);if(p&&validPhoto(p)){modal('식단 사진',`<img class="photo-large" src="${p.data}" alt="${esc(p.name)}"><p class="sub">${esc(p.name)}</p>`,true);return}}
 if(a==='member-calendar-date'){memberCalendarDate=d.date;if(view==='calendar'&&memberCalendarMode==='month')memberCalendarMode='day';closeModal();if(view==='calendar')render();return}
 if(a==='coach-calendar-date'){coachCalendarDate=d.date;coachCalendarMode='day';render();return}
 if(a==='coach-calendar-today'){coachCalendarDate=TODAY;if(coachCalendarMode==='week')weekOffset=0;render();return}
 if(a==='coach-calendar-move'){const dir=+d.dir;if(coachCalendarMode==='week'){weekOffset+=dir}else if(coachCalendarMode==='month'){const x=calendarDate(coachCalendarDate);x.setMonth(x.getMonth()+dir);coachCalendarDate=localDate(x)}else coachCalendarDate=dayOffset(dir*(coachCalendarMode==='five'?5:1),coachCalendarDate);render();return}
 if(a==='phase-topic'){phaseQuickDialog(d.id,d.topic);return}
 if(a==='prior-exercise-add'){const dr=getDraft(),s=DB.sessions.find(x=>x.id===d.id),e=previousExerciseForDraft(s,+d.index);if(!dr||!e)return;dr.exercises.push(e);save();render();toast(e.name+'을 오늘 수업에 추가했어요.');return}
 if(a==='prior-session-add'){const dr=getDraft(),s=DB.sessions.find(x=>x.id===d.id);if(!dr||!s)return;const added=s.exercises.filter(e=>!e.skipped).map((_,i)=>previousExerciseForDraft(s,i)).filter(Boolean);dr.exercises.push(...added);save();render();toast('이전 수업 '+added.length+'개 운동을 추가했어요.');return}
 compactExperienceHandle(a,d,el);
};

let monthRangeDrag=null,monthRangeClickUntil=0;
document.addEventListener('pointerdown',e=>{const day=e.target.closest('.member-month-grid .member-cal-day');if(!day||view!=='calendar'||isCoach||memberCalendarMode!=='month'||e.button>0)return;monthRangeDrag={id:e.pointerId,start:day.dataset.date,end:day.dataset.date,x:e.clientX,y:e.clientY,dragging:false,el:day};day.setPointerCapture?.(e.pointerId)});
document.addEventListener('pointermove',e=>{const r=monthRangeDrag;if(!r||r.id!==e.pointerId)return;if(!r.dragging&&Math.hypot(e.clientX-r.x,e.clientY-r.y)<9)return;const day=document.elementFromPoint(e.clientX,e.clientY)?.closest('.member-month-grid .member-cal-day');if(!day)return;r.dragging=true;r.end=day.dataset.date;const lo=r.start<r.end?r.start:r.end,hi=r.start<r.end?r.end:r.start;$$('.member-cal-day').forEach(x=>x.classList.toggle('range-preview',x.dataset.date>=lo&&x.dataset.date<=hi));if(e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('pointerup',e=>{const r=monthRangeDrag;if(!r||r.id!==e.pointerId)return;monthRangeDrag=null;$$('.member-cal-day').forEach(x=>x.classList.remove('range-preview'));if(!r.dragging)return;monthRangeClickUntil=Date.now()+350;const lo=r.start<r.end?r.start:r.end,hi=r.start<r.end?r.end:r.start,count=Math.round((calendarDate(hi)-calendarDate(lo))/86400000)+1;memberCalendarDate=lo;memberCalendarMode=count>=7?'week':'five';render();toast(count>=7?'일주일 보기를 열었어요.':'5일 보기를 열었어요.')});
document.addEventListener('click',e=>{if(Date.now()<monthRangeClickUntil&&e.target.closest('.member-cal-day')){e.preventDefault();e.stopImmediatePropagation()}},true);

view=['home','preparation','history','calendar','routines','coach','settings','schedule','classes','members','member','care','report','prep','workout','cardio','share'].includes(location.hash.slice(1))?location.hash.slice(1):'home';if(view==='workout'&&!active())view='home';if(view==='prep'&&!getDraft())view='home';currentEx=active()?.currentEx||0;save();render();setInterval(tick,1000);
</script></body></html>
